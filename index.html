<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meta Commerce Platform</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-main: #f3f4f6;
            --panel-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border-color: #e5e7eb;
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --gradient-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px; }
        
        .panel { background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-group label { font-size: 13px; font-weight: bold; color: var(--text-sub); }
        .input-group input, .input-group textarea { padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #f8fafc; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #7c3aed; background: #fff; }
        
        .btn { background: var(--gradient-primary); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; width: 100%; text-align: center;}
        .btn:hover { background: var(--gradient-hover); transform: translateY(-1px); }
        .btn-outline { background: #fff; color: #4f46e5; border: 1px solid #4f46e5; }
        .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

        .tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 25px; overflow-x: auto; }
        .tab { padding: 12px 25px; cursor: pointer; color: var(--text-sub); border-bottom: 3px solid transparent; transition: 0.2s; font-weight: bold; white-space: nowrap; }
        .tab.active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }

        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2col { grid-template-columns: 1fr; } }
        
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; background: #fff; display: flex; flex-direction: column; transition: 0.3s; position: relative;}
        .product-card:hover { border-color: #818cf8; transform: translateY(-2px); }
        .product-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; padding-right: 30px; }
        .product-price { font-size: 18px; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; margin-bottom: 12px; }
        .product-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; flex-grow: 1; line-height: 1.5; }
        
        .fav-star { position: absolute; top: 20px; right: 20px; font-size: 20px; cursor: pointer; color: #cbd5e1; user-select: none; transition: color 0.2s; }
        .fav-star.active { color: #f59e0b; }

        .file-list-box { border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; height: 100px; overflow-y: auto; background: #f8fafc; font-size: 13px; margin-bottom: 15px;}
        .file-item { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; cursor: pointer; color: #4f46e5; }
        
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 8px; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        .history-table th, .history-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .history-table th { background: #f8fafc; color: var(--text-sub); }
        
        .chat-drawer { position: fixed; right: -450px; top: 0; width: 400px; max-width: 100%; height: 100vh; background: #fff; box-shadow: -5px 0 25px rgba(0,0,0,0.1); transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; }
        .chat-drawer.open { right: 0; }
        .chat-header { padding: 20px; background: var(--gradient-primary); color: white; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .chat-close { cursor: pointer; font-size: 24px; padding: 0 10px;}
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.4; word-break: break-all; }
        .msg-me { background: #e0e7ff; color: #1e3a8a; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #c7d2fe; }
        .msg-other { background: #fff; border: 1px solid var(--border-color); color: #1f2937; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: #fff; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; }
        .close-btn { color: #ef4444; font-size: 24px; font-weight: bold; cursor: pointer; }
        #preview-timer { color: #ef4444; font-weight: bold; font-size: 16px; margin-bottom: 15px; text-align: center; }
        .viewer-container { width: 100%; background: #000; border-radius: 8px; height: 350px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none;}
        .toast.show { opacity: 1; bottom: 40px; }
        .header-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; padding-bottom: 20px; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px;}
    </style>
</head>
<body>

    <div class="container">
        <div class="panel" id="login-section" style="max-width: 450px; margin: 20px auto; width: 100%;">
            <h2 style="text-align: center; color: #1f2937; font-size: 22px;">Platform Sign In</h2>
            <div class="input-group">
                <label>이름 (Name)</label>
                <input type="text" id="login-name" placeholder="이름 입력">
            </div>
            <div class="input-group">
                <label>비밀번호 (Password)</label>
                <input type="password" id="login-password" placeholder="비밀번호 입력">
            </div>
            <div style="border-top: 1px dashed var(--border-color); margin: 25px 0 15px;"></div>
            <div class="input-group">
                <label>은행명 (Bank)</label>
                <input type="text" id="login-bank" placeholder="예: 신한은행">
            </div>
            <div class="input-group">
                <label>계좌번호 (Account)</label>
                <input type="text" id="login-account" placeholder="예: 110-123-456789">
            </div>
            <button class="btn" onclick="login()">접속하기</button>
        </div>

        <div id="workspace-section" style="display: none;">
            <div class="panel">
                <div class="header-bar">
                    <h1 style="margin: 0; font-size: 22px;">Meta Commerce</h1>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span style="font-weight: 600; font-size: 14px;"><span id="display-name" style="color: #6366f1;"></span> 님</span>
                        <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; font-size: 13px;" onclick="location.reload()">로그아웃</button>
                    </div>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab('wallet')">내 지갑</div>
                    <div class="tab" onclick="switchTab('store')">자산 등록</div>
                    <div class="tab" onclick="switchTab('market')">마켓플레이스</div>
                    <div class="tab" onclick="switchTab('history')">거래 내역</div>
                </div>

                <div id="tab-wallet" class="tab-content active">
                    <div style="background: #f8fafc; border-radius: 12px; padding: 40px 20px; text-align: center; border: 1px solid var(--border-color);">
                        <div style="font-size: 14px; font-weight: bold; color: var(--text-sub); margin-bottom: 10px;">연동 계좌: <span id="display-bank"></span> <span id="display-account"></span></div>
                        <div style="font-size: 44px; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"><span id="display-balance">0</span> KRW</div>
                    </div>
                </div>

                <div id="tab-store" class="tab-content">
                    <div class="grid-2col">
                        <div style="border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; background: #fff;">
                            <h3>디지털 파일 등록</h3>
                            <div class="input-group">
                                <label>등록할 파일 선택</label>
                                <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">
                                <button class="btn btn-secondary" style="margin-bottom: 5px; color: #4f46e5;" onclick="document.getElementById('file-input').click()">PC에서 파일 찾아보기</button>
                                <div class="file-list-box" id="file-list">
                                    <div style="text-align: center; color: #94a3b8; margin-top: 30px;">파일을 선택하세요.</div>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>상품명</label>
                                <input type="text" id="file-name">
                            </div>
                            <div class="input-group">
                                <label>판매 금액 (KRW)</label>
                                <input type="number" id="file-price">
                            </div>
                            <button class="btn" onclick="registerProduct('file')">파일 상품 등록</button>
                        </div>
                        <div style="border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; background: #fff;">
                            <h3>실물 상품 등록</h3>
                            <div class="input-group">
                                <label>상품명</label>
                                <input type="text" id="prod-name">
                            </div>
                            <div class="input-group">
                                <label>판매 금액 (KRW)</label>
                                <input type="number" id="prod-price">
                            </div>
                            <div class="input-group">
                                <label>상세 설명</label>
                                <textarea id="prod-desc"></textarea>
                            </div>
                            <button class="btn" onclick="registerProduct('physical')">실물 상품 등록</button>
                        </div>
                    </div>
                </div>

                <div id="tab-market" class="tab-content">
                    <div class="input-group">
                        <input type="text" id="market-search" placeholder="상품명 또는 설명 검색..." onkeyup="loadMarketplace()">
                    </div>
                    <div class="market-grid" id="market-grid"></div>
                </div>

                <div id="tab-history" class="tab-content">
                    <div class="input-group">
                        <input type="text" id="history-search" placeholder="상품명 또는 거래 대조 검색..." onkeyup="loadHistory()">
                    </div>
                    <div class="table-wrapper">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>거래 일시</th>
                                    <th>유형</th>
                                    <th>상품 정보</th>
                                    <th>파트너</th>
                                    <th>금액 (KRW)</th>
                                </tr>
                            </thead>
                            <tbody id="history-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-drawer" id="chat-drawer">
        <div class="chat-header">
            <span id="chat-title">협상 채널</span>
            <span class="chat-close" onclick="closeChat()">&times;</span>
        </div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="메시지 전송..." onkeypress="if(event.keyCode===13) sendMessage()">
            <button class="btn" style="width: auto; margin: 0; padding: 10px 24px;" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <div class="modal-overlay" id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="preview-title" style="color: #4f46e5;">데이터 스트리밍 미리보기</span>
                <span class="close-btn" onclick="closePreviewModal()">&times;</span>
            </div>
            <div id="preview-timer"></div>
            <div class="viewer-container" id="universal-viewer"></div>
        </div>
    </div>

    <div class="toast" id="toast">알림</div>

    <script>
        // 호스트 환경 자동 수렴 바인딩 (포트 고정형 인덱싱)
        const API_URL = window.location.protocol + '//' + window.location.hostname + ':4000';
        let socket = null;
        let currentUser = null;
        let currentChatRoom = null;
        let currentChatProduct = null;
        let selectedLocalFile = null;
        let previewTimerInterval = null;
        let favoriteList = [];

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const clickedTab = document.querySelector(`.tab[onclick="switchTab('${id}')"]`);
            if(clickedTab) clickedTab.classList.add('active');
            const targetContent = document.getElementById(`tab-${id}`);
            if(targetContent) targetContent.add('active');

            if(id === 'market') loadMarketplace();
            if(id === 'history') loadHistory();
        }

        async function login() {
            const name = document.getElementById('login-name').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const bank = document.getElementById('login-bank').value.trim();
            const account = document.getElementById('login-account').value.trim();
            
            if(!name || !password) return showToast("인증 식별값을 채우세요.");

            try {
                const res = await fetch(`${API_URL}/api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password, bank, account })
                });
                
                const data = await res.json();
                if(!res.ok) return showToast(data.error || "인증 실패");
                
                currentUser = data;
                
                // 소켓 초기화 덤프 타임 동적 로킹
                if (!socket) {
                    socket = io(API_URL, { transports: ['websocket', 'polling'] });
                    socket.on('receive_message', handleReceiveMessage);
                }

                // 즐겨찾기 목록 캐싱 로드
                const favRes = await fetch(`${API_URL}/api/favorites/${currentUser.name}`);
                favoriteList = await favRes.json();

                document.getElementById('login-section').style.display = 'none';
                document.getElementById('workspace-section').style.display = 'block';
                
                document.getElementById('display-name').innerText = data.name;
                document.getElementById('display-bank').innerText = data.bank;
                document.getElementById('display-account').innerText = data.account;
                document.getElementById('display-balance').innerText = data.balance.toLocaleString();

            } catch(e) { 
                showToast("원격 노드 세션 수립 지연. AWS 보안그룹의 4000포트 전송을 확정하세요."); 
            }
        }

        async function updateUserBalance() {
            try {
                const res = await fetch(`${API_URL}/api/users/${currentUser.name}`);
                const data = await res.json();
                currentUser.balance = data.balance;
                document.getElementById('display-balance').innerText = data.balance.toLocaleString();
            } catch(e){}
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            const listBox = document.getElementById('file-list');
            listBox.innerHTML = '';
            selectedLocalFile = null;

            if (!file) {
                listBox.innerHTML = '<div style="text-align: center; color: #94a3b8; margin-top: 30px;">선택 파일 없음</div>';
                return;
            }

            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerText = file.name;
            selectedLocalFile = file;
            document.getElementById('file-name').value = file.name;
            listBox.appendChild(item);
        }

        // ⭐ [완전 교정] XMLHttpRequest 지표 계측 바인딩 (JSON 파싱 유실 파괴)
        function registerProduct(type) {
            const formData = new FormData();
            formData.append('id', 'PRD_' + Date.now());
            formData.append('type', type);
            formData.append('seller', currentUser.name);

            if (type === 'file') {
                if(!selectedLocalFile) return showToast("마운트할 원천 바이너리를 지정하세요.");
                const price = document.getElementById('file-price').value;
                if(!price) return showToast("자산 한도를 기재하세요.");

                formData.append('file', selectedLocalFile);
                formData.append('name', document.getElementById('file-name').value || selectedLocalFile.name);
                formData.append('price', price);
                formData.append('description', '디지털 원장 파일');
            } else {
                const name = document.getElementById('prod-name').value;
                const price = document.getElementById('prod-price').value;
                const desc = document.getElementById('prod-desc').value;
                if(!name || !price) return showToast("필수값 누락");

                formData.append('name', name);
                formData.append('price', price);
                formData.append('description', desc);
            }

            showToast("바이너리 스트림 업로드 게이트 구동 중...");

            // Multipart Boundary Interceptor 강제 확보를 위해 fetch 대신 고전적 XHR 정격 바인딩으로 우회 변경
            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${API_URL}/api/products`, true);
            
            xhr.onload = function () {
                if (xhr.status === 200) {
                    showToast("✅ 자산 스토리지 기입 성료.");
                    document.getElementById('file-name').value = '';
                    document.getElementById('file-price').value = '';
                    document.getElementById('prod-name').value = '';
                    document.getElementById('prod-price').value = '';
                    document.getElementById('prod-desc').value = '';
                    document.getElementById('file-list').innerHTML = '<div style="text-align: center; color: #94a3b8; margin-top: 30px;">자산화할 물리 파일을 지정하세요.</div>';
                    selectedLocalFile = null;
                    switchTab('market');
                } else {
                    showToast("원장 기입 실패. 바운더리 오류 규명 요망.");
                }
            };
            xhr.send(formData);
        }

        async function toggleFavorite(productId, element) {
            try {
                const res = await fetch(`${API_URL}/api/favorites`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userName: currentUser.name, productId })
                });
                const data = await res.json();
                if(data.status === 'added') {
                    element.classList.add('active');
                    favoriteList.push(productId);
                    showToast("즐겨찾기에 등록되었습니다.");
                } else {
                    element.classList.remove('active');
                    favoriteList = favoriteList.filter(id => id !== productId);
                    showToast("즐겨찾기가 해제되었습니다.");
                }
            } catch(e){}
        }

        async function loadMarketplace() {
            try {
                const res = await fetch(`${API_URL}/api/products`);
                let products = await res.json();
                const query = document.getElementById('market-search').value.toLowerCase();
                
                if(query) {
                    products = products.filter(p => p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
                }

                const grid = document.getElementById('market-grid');
                grid.innerHTML = '';

                if(products.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">마켓플레이스 원장 공백</div>';
                    return;
                }

                products.forEach(p => {
                    const isMine = p.seller === currentUser.name;
                    const isFav = favoriteList.includes(p.id) ? 'active' : '';
                    let btnHtml = '';
                    
                    if (isMine) {
                        btnHtml = `<button class="btn btn-outline" style="margin-bottom: 8px;" onclick="openChat('${p.id}', '${p.name}', '${p.seller}')">채널 동기화 모니터링</button>`;
                    } else {
                        btnHtml = `
                            <button class="btn btn-outline" style="margin-bottom: 8px;" onclick="openChat('${p.id}', '${p.name}', '${p.seller}')">판매자와 협상 채팅</button>
                            <button class="btn" onclick="buyProduct('${p.id}', '${p.name}', ${p.price}, '${p.seller}')">자산 지분 청구</button>
                        `;
                    }

                    grid.innerHTML += `
                        <div class="product-card">
                            <span class="fav-star ${isFav}" onclick="toggleFavorite('${p.id}', this)">★</span>
                            <div style="font-size: 12px; color: #6366f1; font-weight: bold; margin-bottom: 8px;">자산 노드</div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price.toLocaleString()} KRW</div>
                            <div class="product-desc">${p.description}</div>
                            <div style="font-size: 12px; color: #64748b; margin-bottom: 15px; border-top: 1px solid #e2e8f0; padding-top: 10px;">원소유자: <b>${p.seller}</b></div>
                            <div style="margin-top: auto;">${btnHtml}</div>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        async function buyProduct(id, name, price, seller) {
            if (currentUser.balance < price) return showToast("결제 지분 한도 도달 부족.");
            if (confirm(`[${name}] 자산 소유 지분을 매입 체결합니까?`)) {
                try {
                    const res = await fetch(`${API_URL}/api/buy`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ buyer: currentUser.name, seller, productId: id, productName: name, amount: price })
                    });
                    
                    // 버퍼 덤프 분기 필터링으로 에러 소멸
                    const text = await res.text();
                    if(!res.ok || !text) return showToast("원장 스마트 계약 체결 실패");
                    const data = JSON.parse(text);
                    
                    if(data.success && data.fileLink) {
                        showToast("✅ 지분 계약 체결 완료. 무손실 다운로드를 시작합니다.");
                        updateUserBalance();
                        
                        const link = document.createElement('a');
                        link.href = API_URL + data.fileLink;
                        link.download = name;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        switchTab('history'); 
                    } else showToast(data.error || "계약 파기");
                } catch(e) { showToast("네트워크 트랜잭션 장애"); }
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${API_URL}/api/transactions/${currentUser.name}`);
                const text = await res.text();
                if(!text) return;
                let history = JSON.parse(text);
                
                const query = document.getElementById('history-search').value.toLowerCase();
                if(query) {
                    history = history.filter(h => h.productName.toLowerCase().includes(query) || h.buyer.toLowerCase().includes(query) || h.seller.toLowerCase().includes(query));
                }

                const tbody = document.getElementById('history-body');
                tbody.innerHTML = '';

                history.forEach(h => {
                    const isBuyer = h.buyer === currentUser.name;
                    const typeHtml = isBuyer ? '<span style="color: #e11d48; font-weight:bold;">지분 매입</span>' : '<span style="color: #059669; font-weight:bold;">지분 매각</span>';
                    tbody.innerHTML += `
                        <tr>
                            <td>${h.date}</td>
                            <td>${typeHtml}</td>
                            <td style="font-weight: 600;">${h.productName}</td>
                            <td>${isBuyer ? h.seller : h.buyer}</td>
                            <td style="font-weight: bold;">${h.amount.toLocaleString()}</td>
                        </tr>
                    `;
                });
            } catch(e) {}
        }

        // --- 채팅 아키텍처 수립 파트 ---
        function openChat(productId, productName, sellerName) {
            currentChatProduct = productId;
            const participants = [currentUser.name, sellerName].sort().join('_');
            currentChatRoom = `room_${productId}_${participants}`;

            document.getElementById('chat-title').innerText = `${productName}`;
            document.getElementById('chat-drawer').classList.add('open');
            
            socket.emit('join_room', currentChatRoom);
            loadChatHistory();
        }

        function closeChat() {
            document.getElementById('chat-drawer').classList.remove('open');
            currentChatRoom = null;
        }

        async function loadChatHistory() {
            try {
                const res = await fetch(`${API_URL}/api/chat/${currentChatRoom}`);
                const text = await res.text();
                const chatBody = document.getElementById('chat-body');
                chatBody.innerHTML = '';
                
                if (!res.ok || !text || text === '[]') {
                    chatBody.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:20px;">채널 보안 터널 수립 완료. 대화를 개시하세요.</div>';
                    return;
                }
                
                const messages = JSON.parse(text);
                messages.forEach(m => appendMessage(m.sender, m.message, m.date));
            } catch(e) {
                document.getElementById('chat-body').innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:20px;">채널 보안 터널 수립 완료. 대화를 개시하세요.</div>';
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg || !currentChatRoom) return;

            const data = {
                roomId: currentChatRoom,
                productId: currentChatProduct,
                sender: currentUser.name,
                message: msg
            };

            socket.emit('send_message', data);
            const date = new Date().toLocaleString('ko-KR');
            appendMessage(currentUser.name, msg, date);
            input.value = '';
        }

        function handleReceiveMessage(data) {
            if(data.roomId === currentChatRoom && data.sender !== currentUser.name) {
                const emptyState = document.querySelector('#chat-body div[style*="text-align:center"]');
                if(emptyState) emptyState.remove();
                appendMessage(data.sender, data.message, data.date);
            }
        }

        function appendMessage(sender, text, date) {
            const chatBody = document.getElementById('chat-body');
            const emptyState = chatBody.querySelector('div[style*="text-align:center"]');
            if(emptyState) emptyState.remove();

            const isMe = sender === currentUser.name;
            const bubbleClass = isMe ? 'msg-me' : 'msg-other';
            chatBody.innerHTML += `
                <div class="msg-bubble ${bubbleClass}">
                    <div class="msg-sender">${isMe ? '나' : sender}</div>
                    <div>${text}</div>
                    <div class="msg-date">${date}</div>
                </div>
            `;
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function openPreviewModal(productName, isPreviewOnly) {
            document.getElementById('preview-modal').style.display = 'flex';
            const viewer = document.getElementById('universal-viewer');
            const timerEl = document.getElementById('preview-timer');
            
            if (isPreviewOnly) {
                let timeLeft = 60;
                timerEl.innerText = `⏱ 남은 미리보기 시간: ${timeLeft}초`;
                previewTimerInterval = setInterval(() => {
                    timeLeft--;
                    timerEl.innerText = `⏱ 남은 미리보기 시간: ${timeLeft}초`;
                    if (timeLeft <= 0) closePreviewModal();
                }, 1000);
            } else {
                timerEl.innerText = '✅ 무제한 지분 보유 검증 완료';
            }
            viewer.innerHTML = `<div style="color:#aaa; font-size:13px;">[스트리밍 버퍼 활성화] ${productName}</div>`;
        }

        function closePreviewModal() {
            clearInterval(previewTimerInterval);
            document.getElementById('preview-modal').style.display = 'none';
        }
    </script>
</body>
</html>
