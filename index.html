<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OYP Unified Node v2.0</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --bg: #09090b; --panel: #18181b; --primary: #3b82f6; --text: #f8fafc; --border: #27272a; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 240px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .nav-item { padding: 20px; cursor: pointer; border-bottom: 1px solid var(--border); font-weight: 700; color: #94a3b8; transition: 0.3s; }
        .nav-item.active { background: rgba(59,130,246,0.1); color: var(--primary); border-right: 4px solid var(--primary); }
        .main { flex: 1; display: flex; flex-direction: column; }
        .tab-content { display: none; padding: 30px; flex: 1; overflow-y: auto; }
        .tab-content.active { display: block; }
        #viewer { width: 100%; height: 500px; background: #000; border-radius: 12px; border: 1px solid var(--border); margin-top: 20px; position: relative; }
        .card { background: var(--panel); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: flex; justify-content: center; align-items: center; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="background:var(--panel); padding:40px; border-radius:15px; border:1px solid var(--primary); width:350px; text-align:center;">
        <h2 style="color:var(--primary); margin-top:0;">OYP NODE ACCESS</h2>
        <input type="text" id="loginId" placeholder="지갑 ID (이름)">
        <input type="password" id="loginKey" placeholder="보안 키 (d)">
        <button onclick="login()">데이터 네트워크 접속</button>
    </div>
</div>

<div class="sidebar">
    <div style="padding:25px; font-weight:900; color:var(--primary); font-size:22px; letter-spacing:1px;">OYP PLATFORM</div>
    <div class="nav-item active" onclick="tab('manage')">📁 데이터 보안 관리</div>
    <div class="nav-item" onclick="tab('view')">👁️ 실시간 3D 협진</div>
    <div class="nav-item" onclick="tab('asset')">💸 자산 및 거래 장부</div>
</div>

<div class="main">
    <div style="height:70px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 30px; justify-content:space-between;">
        <strong id="header-user">접속 대기</strong>
        <div style="color:#10b981; font-weight:bold;">💎 <span id="bal-hmj">0.00</span> HMJ</div>
    </div>

    <div id="tab-manage" class="tab-content active">
        <div class="card">
            <h3>MARS-1 알고리즘 업로드</h3>
            <p style="color:#94a3b8; font-size:14px;">데이터 계수 $A_d, B_d$를 이용해 물리적 박제를 진행합니다.</p>
            <input type="file" id="upFile">
            <button onclick="upload()">보안 전송 실행</button>
        </div>
        <div class="card">
            <h3>보안 저장소 목록</h3>
            <div id="file-list" style="margin-top:15px;"></div>
        </div>
    </div>

    <div id="tab-view" class="tab-content">
        <div class="card">
            <h3>대수기하학적 복호화 및 렌더링</h3>
            <div id="viewer">
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#555;">복호화 승인 대기중...</div>
            </div>
        </div>
    </div>

    <div id="tab-asset" class="tab-content">
        <div class="card">
            <h3>트랜잭션 히스토리 (Ledger)</h3>
            <div id="history" style="font-family:monospace; font-size:13px; color:#10b981;"></div>
        </div>
    </div>
</div>

<script>
    let MY_ID = '', MY_KEY = 0;
    const socket = io();

    async function login() {
        MY_ID = document.getElementById('loginId').value;
        MY_KEY = parseInt(document.getElementById('loginKey').value);
        const res = await fetch(`/api/account/${MY_ID}`);
        const acc = await res.json();
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('header-user').innerText = `ID: ${MY_ID}`;
        document.getElementById('bal-hmj').innerText = acc.hmj.toFixed(2);
        document.getElementById('history').innerHTML = acc.history.map(h => `<div>[${h.time}] ${h.msg}</div>`).join('');
        refreshFiles();
    }

    function tab(id) {
        document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(v => v.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('tab-'+id).classList.add('active');
    }

    async function upload() {
        const file = document.getElementById('upFile').files[0];
        const formData = new FormData();
        formData.append('file', file);
        formData.append('uploaderId', MY_ID);
        formData.append('Ad', 5 + MY_KEY); 
        formData.append('Bd', 7 - MY_KEY);
        await fetch('/api/upload', { method: 'POST', body: formData });
        alert("데이터가 암호화되어 OYP 노드에 저장되었습니다.");
        refreshFiles();
    }

    async function refreshFiles() {
        const res = await fetch(`/api/files/${MY_ID}`);
        const files = await res.json();
        document.getElementById('file-list').innerHTML = files.map(f => 
            `<div style="padding:10px; border-bottom:1px solid #27272a;">📄 ${f.filename} (${f.size}) - <span style="color:var(--primary)">SECURED</span></div>`
        ).join('');
    }
</script>
</body>
</html>
