<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meta Commerce Platform</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/dicom-parser@1.8.13/dist/dicomParser.min.js"></script>
    <script src="https://unpkg.com/cornerstone-core@2.3.0/dist/cornerstone.min.js"></script>
    <script src="https://unpkg.com/cornerstone-wado-image-loader@4.1.5/dist/cornerstoneWADOImageLoader.min.js"></script>

    <style>
        :root { --bg-main: #f3f4f6; --panel-bg: #ffffff; --text-main: #1f2937; --text-sub: #6b7280; --border-color: #e5e7eb; --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); --gradient-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%); }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h1, h2, h3 { margin-top: 0; color: var(--text-main); }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-group label { font-size: 13px; font-weight: bold; color: var(--text-sub); }
        .input-group input, .input-group textarea { padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #f8fafc; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #7c3aed; background: #fff; }
        .btn { background: var(--gradient-primary); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; width: 100%; text-align: center;}
        .btn:hover { transform: translateY(-1px); opacity: 0.9;}
        .btn-outline { background: #fff; color: #4f46e5; border: 1px solid #4f46e5; }
        .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 25px; overflow-x: auto; scrollbar-width: none;}
        .tab { padding: 12px 20px; cursor: pointer; color: var(--text-sub); border-bottom: 3px solid transparent; transition: 0.2s; font-weight: bold; white-space: nowrap; font-size: 14px;}
        .tab.active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2col { grid-template-columns: 1fr; } }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; background: #fff; display: flex; flex-direction: column; transition: 0.3s; position: relative;}
        .product-card:hover { border-color: #818cf8; transform: translateY(-2px); }
        .product-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; padding-right: 30px; }
        .product-price { font-size: 18px; color: #4f46e5; font-weight: 900; margin-bottom: 12px; }
        .product-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; flex-grow: 1; line-height: 1.5; }
        .fav-star { position: absolute; top: 20px; right: 20px; font-size: 20px; cursor: pointer; color: #cbd5e1; user-select: none; transition: color 0.2s; }
        .fav-star.active { color: #f59e0b; }
        .store-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; background: #fff; display: flex; align-items: center; justify-content: space-between;}
        .store-avatar { width: 50px; height: 50px; background: #e0e7ff; color: #4f46e5; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; margin-right: 15px;}
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 8px; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        .history-table th, .history-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .history-table th { background: #f8fafc; color: var(--text-sub); }
        .chat-drawer { position: fixed; right: -450px; top: 0; width: 400px; max-width: 100%; height: 100vh; background: #fff; box-shadow: -5px 0 25px rgba(0,0,0,0.1); transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; }
        .chat-drawer.open { right: 0; }
        .chat-header { padding: 20px; background: var(--gradient-primary); color: white; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .chat-close { cursor: pointer; font-size: 24px; padding: 0 10px;}
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.4; word-break: break-all; }
        .msg-me { background: #e0e7ff; color: #1e3a8a; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #c7d2fe; }
        .msg-other { background: #fff; border: 1px solid var(--border-color); color: #1f2937; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: #fff; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: #1a1c20; padding: 20px; border-radius: 12px; width: 95%; max-width: 900px; height: 80vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #333; color: #fff;}
        .close-btn { color: #ef4444; font-size: 24px; font-weight: bold; cursor: pointer; }
        .viewer-container { flex: 1; width: 100%; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; color:#fff;}
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none;}
        .toast.show { opacity: 1; bottom: 40px; }
        .header-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; padding-bottom: 20px; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px;}
        .prod-thumbnail { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #f1f5f9; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel" id="login-section" style="max-width: 450px; margin: 20px auto; width: 100%;">
            <h2 style="text-align: center; color: #1f2937;">Platform Sign In</h2>
            <div class="input-group"><label>이름 (Name)</label><input type="text" id="ray-login-name"></div>
            <div class="input-group"><label>비밀번호 (Password)</label><input type="password" id="ray-login-password"></div>
            <div style="border-top: 1px dashed var(--border-color); margin: 25px 0 15px;"></div>
            <p style="font-size: 12px; color: #6366f1; font-weight: bold; margin-bottom: 10px;">신규 가입자 전용 정산 원장 스펙</p>
            <div class="input-group"><label>은행명 (Bank)</label><input type="text" id="ray-login-bank" placeholder="예: 신한은행"></div>
            <div class="input-group"><label>계좌번호 (Account)</label><input type="text" id="ray-login-account" placeholder="예: 110-123-456789"></div>
            <button class="btn" style="margin-top: 10px;" onclick="login()">접속하기</button>
        </div>

        <div id="workspace-section" style="display: none;">
            <div class="panel">
                <div class="header-bar">
                    <h1 style="margin: 0; font-size: 22px;">Meta Commerce</h1>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span style="font-weight: 600; font-size: 14px;"><span id="display-name" style="color: #6366f1;"></span> 님</span>
                        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="location.reload()">로그아웃</button>
                    </div>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab('wallet')">내 지갑 및 송금</div>
                    <div class="tab" onclick="switchTab('my-store')">내 상점</div>
                    <div class="tab" onclick="switchTab('store')">자산 등록</div>
                    <div class="tab" onclick="switchTab('market')">마켓플레이스</div>
                    <div class="tab" onclick="switchTab('stores-list')">파트너 검색</div>
                    <div class="tab" onclick="switchTab('history')">거래 내역</div>
                </div>

                <div id="tab-wallet" class="tab-content active">
                    <div style="background: #f8fafc; border-radius: 12px; padding: 40px 20px; text-align: center; border: 1px solid var(--border-color);">
                        <div style="font-size: 14px; font-weight: bold; color: var(--text-sub); margin-bottom: 10px;">연동 원장 계좌 가용 자산</div>
                        <div style="font-size: 44px; font-weight: 800; color:#4f46e5;"><span id="display-balance">0</span> KRW</div>
                    </div>

                    <div class="grid-2col">
                        <div style="border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; background: #fff;">
                            <h3 style="font-size: 16px; color: #059669; margin-bottom: 15px;">다이렉트 송금 (P2P)</h3>
                            <div class="input-group"><label>받는 사람 (이름)</label><input type="text" id="p2p-target" placeholder="수신자 이름"></div>
                            <div class="input-group"><label>송금 금액 (KRW)</label><input type="number" id="p2p-amount" placeholder="보낼 금액"></div>
                            <button class="btn btn-secondary" style="background:#10b981; color:#fff; border:none; margin-top: 10px;" onclick="p2pTransfer()">즉시 송금</button>
                        </div>
                    </div>

                    <div style="border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; background: #fff; margin-top: 20px;">
                        <h3 style="font-size: 16px; color: #4f46e5; margin-bottom: 15px;">QR 수표 통화 시스템</h3>
                        <div class="grid-2col">
                            <div style="padding-right: 20px; border-right: 1px solid #e2e8f0;">
                                <div class="input-group"><label>수표 발행 금액 (KRW)</label><input type="number" id="check-amount" placeholder="발행 금액"></div>
                                <button class="btn" style="background:#a9c2e3; color:#000;" onclick="issueCheck()">QR 수표 발행</button>
                                <div id="qr-display" style="margin-top: 15px; text-align: center; display:none;">
                                    <canvas id="qr-canvas"></canvas>
                                    <div style="font-size: 12px; color: #64748b; margin-top: 5px;">생성된 수표를 캡처하여 전달하세요.</div>
                                </div>
                            </div>
                            <div style="padding-left: 10px; display: flex; flex-direction: column; justify-content: center;">
                                <div class="input-group" style="text-align: center;">
                                    <label style="margin-bottom: 15px;">받은 QR 수표 스캔 (충전)</label>
                                    <input type="file" id="check-upload" accept="image/*" style="display: none;" onchange="readQRCheck(event)">
                                    <button class="btn" style="background:#374151; color:#fff;" onclick="document.getElementById('check-upload').click()">+ QR 수표 이미지 첨부 및 충전</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="tab-my-store" class="tab-content"><h3 style="margin-bottom: 0;">내 상점 관리</h3><div class="market-grid" id="my-store-grid"></div></div>

                <div id="tab-store" class="tab-content">
                    <div class="grid-2col">
                        <div style="border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; background: #fff;">
                            <h3 style="font-size: 16px;">디지털 자산 (폴더/파일) 등록</h3>
                            <div class="input-group">
                                <label>데이터 연동</label>
                                <input type="file" id="file-input" webkitdirectory directory multiple style="display: none;" onchange="handleFileSelect(event)">
                                <button class="btn btn-secondary" style="color: #4f46e5;" onclick="document.getElementById('file-input').click()">PC 폴더 연동하기</button>
                                <div id="file-list" style="margin-top: 5px; font-size:12px; color:var(--text-sub);"></div>
                            </div>
                            <div class="input-group"><label>상품명</label><input type="text" id="file-name"></div>
                            <div class="input-group"><label>금액 (KRW)</label><input type="number" id="file-price"></div>
                            <button class="btn" style="margin-top: 10px;" onclick="registerProduct('file')">자산 등록</button>
                        </div>
                        <div style="border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; background: #fff;">
                            <h3 style="font-size: 16px;">실물 자산 등록</h3>
                            <div class="input-group">
                                <label>사진 촬영/첨부</label>
                                <input type="file" id="physical-img" accept="image/*" capture="environment" style="display: none;" onchange="handleImgSelect(event)">
                                <button class="btn btn-secondary" style="color: #059669;" onclick="document.getElementById('physical-img').click()">📸 사진 촬영/첨부</button>
                                <img id="physical-img-preview" src="" style="width: 100%; max-height: 150px; object-fit: contain; margin-top: 10px; display: none;">
                            </div>
                            <div class="input-group"><label>품명</label><input type="text" id="prod-name"></div>
                            <div class="input-group"><label>금액 (KRW)</label><input type="number" id="prod-price"></div>
                            <div class="input-group"><label>스펙</label><textarea id="prod-desc"></textarea></div>
                            <button class="btn" style="margin-top: 10px;" onclick="registerPhysicalProduct()">자산 등록</button>
                        </div>
                    </div>
                </div>

                <div id="tab-market" class="tab-content">
                    <div class="input-group"><input type="text" id="market-search" placeholder="자산 검색..." onkeyup="loadMarketplace()"></div>
                    <div class="market-grid" id="market-grid"></div>
                </div>
                
                <div id="tab-stores-list" class="tab-content"><h3 style="margin-bottom: 0;">파트너 상점 목록</h3><div style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;" id="stores-list-container"></div></div>

                <div id="tab-history" class="tab-content">
                    <div class="table-wrapper">
                        <table class="history-table">
                            <thead><tr><th>일시</th><th>구분</th><th>품명(내역)</th><th>상대방</th><th>금액</th></tr></thead>
                            <tbody id="history-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-drawer" id="chat-drawer">
        <div class="chat-header"><span id="chat-title">채널 동기화</span><span class="chat-close" onclick="closeChat()">&times;</span></div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="패킷 전송..." onkeypress="if(event.keyCode===13) sendMessage()">
            <button class="btn" style="width: auto; margin: 0; padding: 10px 24px;" onclick="sendMessage()">전송</button>
        </div>
    </div>
    
    <div class="modal-overlay" id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="preview-title" style="color: #4f46e5; font-weight:bold;">라이브 스트리밍 미리보기</span>
                <span class="close-btn" onclick="closePreviewModal()">&times;</span>
            </div>
            <div id="preview-timer" style="text-align:center; font-weight:bold; margin-bottom: 10px; color:#ef4444;"></div>
            <div class="viewer-container" id="universal-viewer"></div>
        </div>
    </div>

    <div class="toast" id="toast">알림 메시지</div>

    <script>
        cornerstoneWADOImageLoader.external.cornerstone = cornerstone;
        cornerstoneWADOImageLoader.external.dicomParser = dicomParser;
        cornerstoneWADOImageLoader.configure({ useWebWorkers: false });

        const API_URL = window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '');
        let socket = null; let currentUser = null; let currentChatRoom = null; 
        let selectedLocalFiles = []; let selectedPhysicalImg = null;
        let favoriteProducts = []; let favoriteStores = []; let previewTimerInterval = null;

        function showToast(msg) {
            const toast = document.getElementById('toast'); toast.innerText = msg;
            toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${id}')"]`).classList.add('active');
            document.getElementById(`tab-${id}`).classList.add('active');
            if(id === 'market') loadMarketplace();
            if(id === 'my-store') loadMyStore();
            if(id === 'stores-list') loadStoresList();
            if(id === 'history') loadHistory();
        }

        async function login() {
            // 고유 ID를 통해 브라우저 오작동(중복 HTML) 100% 방지
            const nameEl = document.getElementById('ray-login-name');
            const passEl = document.getElementById('ray-login-password');
            const bankEl = document.getElementById('ray-login-bank');
            const accEl = document.getElementById('ray-login-account');

            if(!nameEl || !passEl) return showToast("프론트엔드 오류: 입력창을 찾을 수 없습니다.");

            const name = nameEl.value.trim();
            const password = passEl.value.trim();
            const bank = bankEl && bankEl.value.trim() !== '' ? bankEl.value.trim() : '등록은행';
            const account = accEl && accEl.value.trim() !== '' ? accEl.value.trim() : '000-000';
            
            if(!name || !password) return showToast("[프론트엔드 알림] 이름과 비밀번호를 반드시 입력하세요.");

            try {
                const res = await fetch(`${API_URL}/api/auth`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password, bank, account })
                });
                const data = await res.json();
                if(!res.ok) return showToast(data.error);
                
                socket = io(API_URL, { transports: ['websocket', 'polling'] });
                socket.on('receive_message', handleReceiveMessage);
                currentUser = data;

                await loadFavorites();
                
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('workspace-section').style.display = 'block';
                document.getElementById('display-name').innerText = data.name;
                updateUserBalance();
            } catch(e) { showToast("네트워크 또는 DB 연결 오류가 발생했습니다."); }
        }

        async function updateUserBalance() {
            try {
                const res = await fetch(`${API_URL}/api/users/${currentUser.name}`);
                const data = await res.json();
                currentUser.balance = data.balance;
                document.getElementById('display-balance').innerText = data.balance.toLocaleString();
            } catch(e){}
        }

        async function loadFavorites() {
            try {
                const res = await fetch(`${API_URL}/api/favorites/${currentUser.name}`);
                const data = await res.json();
                favoriteProducts = data.products || []; favoriteStores = data.stores || [];
            } catch(e) {}
        }

        async function p2pTransfer() {
            const target = document.getElementById('p2p-target').value.trim();
            const amount = parseInt(document.getElementById('p2p-amount').value);
            if(!target || isNaN(amount) || amount <= 0) return showToast("수신자와 금액을 확인하세요.");
            if(amount > currentUser.balance) return showToast("잔액이 부족합니다.");

            try {
                const res = await fetch(`${API_URL}/api/transfer`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: currentUser.name, receiver: target, amount })
                });
                const data = await res.json();
                if(res.ok) {
                    showToast(`[${target}] 님에게 ${amount.toLocaleString()}원 송금 완료!`);
                    document.getElementById('p2p-amount').value = ''; document.getElementById('p2p-target').value = '';
                    updateUserBalance(); switchTab('history');
                } else showToast(data.error);
            } catch(e) { showToast("통신 오류"); }
        }

        async function issueCheck() {
            const amount = parseInt(document.getElementById('check-amount').value);
            if(isNaN(amount) || amount <= 0) return showToast("금액을 정확히 입력하세요.");
            if(amount > currentUser.balance) return showToast("잔액이 부족합니다.");

            try {
                const res = await fetch(`${API_URL}/api/check/issue`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ issuer: currentUser.name, amount })
                });
                const data = await res.json();
                if(res.ok) {
                    const canvas = document.getElementById('qr-canvas');
                    QRCode.toCanvas(canvas, data.checkId, { width: 160 }, function (error) {
                        if (error) console.error(error);
                        else {
                            document.getElementById('qr-display').style.display = 'block';
                            document.getElementById('check-amount').value = '';
                            showToast(`${amount.toLocaleString()}원 수표 발행 완료`);
                            updateUserBalance();
                        }
                    });
                } else showToast(data.error);
            } catch(e) { showToast("통신 오류"); }
        }

        function readQRCheck(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, img.width, img.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    if(code) redeemCheck(code.data);
                    else showToast("유효한 QR 코드를 찾을 수 없습니다.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function redeemCheck(checkId) {
            try {
                const res = await fetch(`${API_URL}/api/check/redeem`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ redeemer: currentUser.name, checkId })
                });
                const data = await res.json();
                if(res.ok) {
                    showToast(`수표 충전 성공! ${data.amount.toLocaleString()}원이 지급되었습니다.`);
                    updateUserBalance(); switchTab('history');
                } else showToast(data.error);
            } catch(e) { showToast("통신 오류"); }
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            selectedLocalFiles = [];
            if (!files || files.length === 0) return;
            selectedLocalFiles = files;
            let folderName = files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : `데이터 (${files.length}개)`;
            document.getElementById('file-name').value = folderName;
            document.getElementById('file-list').innerHTML = `📁 ${folderName} (${files.length}개)`;
        }

        function handleImgSelect(event) {
            const file = event.target.files[0];
            if(!file) return;
            selectedPhysicalImg = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgEl = document.getElementById('physical-img-preview');
                imgEl.src = e.target.result; imgEl.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }

        function registerProduct(type) {
            const formData = new FormData();
            formData.append('type', type); formData.append('seller', currentUser.name);
            if(!selectedLocalFiles || selectedLocalFiles.length === 0) return showToast("폴더를 지정하세요.");
            const price = document.getElementById('file-price').value;
            if(!price) return showToast("금액을 기재하세요.");

            for (let i = 0; i < selectedLocalFiles.length; i++) { formData.append('files', selectedLocalFiles[i]); }
            formData.append('name', document.getElementById('file-name').value);
            formData.append('price', price); formData.append('description', '디지털 자산');

            showToast("업로드 중...");
            const xhr = new XMLHttpRequest(); xhr.open('POST', `${API_URL}/api/products/digital`, true);
            xhr.onload = function () { if (xhr.status === 200) { showToast("✅ 등록 완료"); switchTab('my-store'); } };
            xhr.send(formData);
        }

        function registerPhysicalProduct() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const desc = document.getElementById('prod-desc').value;
            if(!name || !price) return showToast("필수값 누락");

            const formData = new FormData();
            formData.append('type', 'physical'); formData.append('seller', currentUser.name);
            formData.append('name', name); formData.append('price', price); formData.append('description', desc);
            if(selectedPhysicalImg) formData.append('image', selectedPhysicalImg);

            showToast("업로드 중...");
            const xhr = new XMLHttpRequest(); xhr.open('POST', `${API_URL}/api/products/physical`, true);
            xhr.onload = function () { if (xhr.status === 200) { showToast("✅ 등록 완료"); switchTab('my-store'); } };
            xhr.send(formData);
        }

        async function toggleStoreFavorite(storeName, element) {
            try {
                const res = await fetch(`${API_URL}/api/favorites/store`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userName: currentUser.name, storeName })
                });
                const data = await res.json();
                if(data.status === 'added') {
                    element.classList.add('active'); favoriteStores.push(storeName); showToast("상점 즐겨찾기 완료");
                } else {
                    element.classList.remove('active'); favoriteStores = favoriteStores.filter(s => s !== storeName); showToast("상점 즐겨찾기 해제");
                }
            } catch(e){}
        }

        async function loadStoresList() {
            try {
                const res = await fetch(`${API_URL}/api/stores`); const stores = await res.json();
                const container = document.getElementById('stores-list-container'); container.innerHTML = '';
                stores.forEach(store => {
                    if(store === currentUser.name) return;
                    const isFav = favoriteStores.includes(store) ? 'active' : '';
                    container.innerHTML += `
                        <div class="store-card">
                            <div style="display:flex; align-items:center;">
                                <div class="store-avatar">${store.charAt(0)}</div>
                                <div>
                                    <h4 style="margin:0; font-size:16px;">${store} 님의 상점</h4>
                                    <span style="font-size:12px; color: #64748b; cursor:pointer; text-decoration:underline;" onclick="searchStore('${store}')">등록 자산 보기</span>
                                </div>
                            </div>
                            <span class="fav-star ${isFav}" style="position:static;" onclick="toggleStoreFavorite('${store}', this)">★</span>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        function searchStore(storeName) { switchTab('market'); document.getElementById('market-search').value = storeName; loadMarketplace(); }

        function createProductCard(p, history, showSeller = true) {
            const isMine = p.seller === currentUser.name;
            const isPurchased = history.some(h => h.type === 'asset' && h.buyer === currentUser.name && h.productName === p.name);
            const hasAccess = isMine || isPurchased;

            let actionBtns = '';
            if (hasAccess) {
                actionBtns = `<button class="btn" style="background: #374151; box-shadow:none; margin-bottom: 8px;" onclick="openPreviewModal('${p.name}', '${p.filePath}', '${p.type}', false)">▶ 무제한 스트리밍</button>`;
            } else {
                actionBtns = `
                    <button class="btn" style="background:rgba(255, 59, 48, 0.1); color:#ff3b30; border:1px solid #ff3b30; margin-bottom:8px;" onclick="openPreviewModal('${p.name}', '${p.filePath}', '${p.type}', true)">⏱ 1분 미리보기</button>
                    <button class="btn btn-green" style="background:#10b981; color:#fff;" onclick="buyProduct('${p.id}', '${p.name}', ${p.price}, '${p.seller}')">💳 자산 구매 (${p.price.toLocaleString()}원)</button>
                `;
            }

            const thumbHtml = p.type === 'physical' && p.filePath ? `<img src="${API_URL}${p.filePath}" class="prod-thumbnail">` : '';
            const tag = p.type === 'file' ? '💾 디지털 렌더링 파일' : '📦 실물 촬영 자산';

            return `
                <div class="product-card">
                    ${thumbHtml}
                    <div style="font-size: 12px; color: #6366f1; font-weight: bold; margin-bottom: 8px;">${tag}</div>
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price.toLocaleString()} KRW</div>
                    <div class="product-desc">${p.description}</div>
                    ${showSeller ? `<div style="font-size: 12px; color: #64748b; margin-bottom: 15px; border-top: 1px solid #e2e8f0; padding-top: 10px;">상점: <b>${p.seller}</b></div>` : ''}
                    <div style="margin-top: auto; display:flex; flex-direction:column;">
                        ${!isMine ? `<button class="btn btn-outline" style="margin-bottom: 8px;" onclick="openChat('${p.id}', '${p.name}', '${p.seller}')">판매자 문의 채팅</button>` : ''}
                        ${actionBtns}
                    </div>
                </div>
            `;
        }

        async function loadMyStore() {
            try {
                const res = await fetch(`${API_URL}/api/products`); let products = await res.json();
                products = products.filter(p => p.seller === currentUser.name);
                const grid = document.getElementById('my-store-grid'); grid.innerHTML = '';
                if(products.length === 0) return grid.innerHTML = '<div style="grid-column:1/-1; padding:20px; color:#94a3b8;">등록한 자산이 없습니다.</div>';
                products.forEach(p => { grid.innerHTML += createProductCard(p, [], false); });
            } catch(e){}
        }

        async function loadMarketplace() {
            try {
                const res = await fetch(`${API_URL}/api/products`); let products = await res.json();
                const query = document.getElementById('market-search').value.toLowerCase();
                if(query) products = products.filter(p => p.name.toLowerCase().includes(query) || p.seller.toLowerCase().includes(query));

                const grid = document.getElementById('market-grid'); grid.innerHTML = '';
                if(products.length === 0) return grid.innerHTML = '<div style="grid-column: 1/-1; padding:40px; color:#94a3b8;">검색 결과 없음</div>';

                const histRes = await fetch(`${API_URL}/api/transactions/${currentUser.name}`);
                const history = await histRes.json();
                products.forEach(p => { grid.innerHTML += createProductCard(p, history, true); });
            } catch(e) {}
        }

        async function buyProduct(id, name, price, seller) {
            if (confirm(`[${name}] 자산을 구매하시겠습니까?`)) {
                try {
                    const res = await fetch(`${API_URL}/api/buy`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ buyer: currentUser.name, seller, productId: id, productName: name, amount: price })
                    });
                    const data = await res.json();
                    if(data.success) {
                        showToast("✅ 결제 및 무제한 스트리밍 권한 부여 완료");
                        updateUserBalance(); switchTab('history'); 
                    } else showToast(data.error);
                } catch(e) { showToast("네트워크 장애"); }
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${API_URL}/api/transactions/${currentUser.name}`);
                let history = await res.json();
                const tbody = document.getElementById('history-body'); tbody.innerHTML = '';
                if(history.length === 0) return tbody.innerHTML = '<tr><td colspan="5">내역 없음</td></tr>';

                history.forEach(h => {
                    let typeHtml, counterParty, amountStr;
                    if(h.type === 'transfer') {
                        const isSender = h.sender === currentUser.name;
                        typeHtml = isSender ? '<span style="color: #ea580c; font-weight:bold;">송금출금</span>' : '<span style="color: #2563eb; font-weight:bold;">송금입금</span>';
                        counterParty = isSender ? h.receiver : h.sender;
                        amountStr = (isSender ? '-' : '+') + h.amount.toLocaleString();
                    } else if (h.type === 'asset') {
                        const isBuyer = h.buyer === currentUser.name;
                        typeHtml = isBuyer ? '<span style="color: #e11d48; font-weight:bold;">자산구매</span>' : '<span style="color: #059669; font-weight:bold;">자산판매</span>';
                        counterParty = isBuyer ? h.seller : h.buyer;
                        amountStr = (isBuyer ? '-' : '+') + h.amount.toLocaleString();
                    } else if (h.type === 'check_issue') {
                        typeHtml = '<span style="color: #475569; font-weight:bold;">수표발행</span>';
                        counterParty = 'QR수표';
                        amountStr = '-' + h.amount.toLocaleString();
                    } else {
                        typeHtml = '<span style="color: #2563eb; font-weight:bold;">수표충전</span>';
                        counterParty = 'QR수표';
                        amountStr = '+' + h.amount.toLocaleString();
                    }
                    tbody.innerHTML += `<tr><td>${h.date}</td><td>${typeHtml}</td><td>${h.productName || 'P2P/수표'}</td><td>${counterParty}</td><td>${amountStr}</td></tr>`;
                });
            } catch(e) {}
        }

        function openChat(productId, productName, sellerName) {
            currentChatRoom = `room_${productId}_${[currentUser.name, sellerName].sort().join('_')}`;
            document.getElementById('chat-title').innerText = productName;
            document.getElementById('chat-drawer').classList.add('open');
            socket.emit('join_room', currentChatRoom); loadChatHistory();
        }
        function closeChat() { document.getElementById('chat-drawer').classList.remove('open'); }
        async function loadChatHistory() {
            try {
                const res = await fetch(`${API_URL}/api/chat/${currentChatRoom}`); const messages = await res.json();
                const chatBody = document.getElementById('chat-body'); chatBody.innerHTML = '';
                messages.forEach(m => appendMessage(m.sender, m.message, m.date));
            } catch(e) {}
        }
        function sendMessage() {
            const input = document.getElementById('chat-input'); const msg = input.value.trim();
            if(!msg) return;
            socket.emit('send_message', { roomId: currentChatRoom, sender: currentUser.name, message: msg });
            appendMessage(currentUser.name, msg, new Date().toLocaleString('ko-KR')); input.value = '';
        }
        function handleReceiveMessage(data) {
            if(data.roomId === currentChatRoom && data.sender !== currentUser.name) appendMessage(data.sender, data.message, data.date);
        }
        function appendMessage(sender, text, date) {
            const chatBody = document.getElementById('chat-body'); const isMe = sender === currentUser.name;
            chatBody.innerHTML += `<div class="msg-bubble ${isMe ? 'msg-me' : 'msg-other'}"><div class="msg-sender">${isMe ? '나' : sender}</div><div>${text}</div></div>`;
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function openPreviewModal(productName, filePath, type, isPreviewOnly) {
            clearInterval(previewTimerInterval);
            document.getElementById('preview-modal').style.display = 'flex';
            const viewer = document.getElementById('universal-viewer');
            const timerEl = document.getElementById('preview-timer');
            
            if (isPreviewOnly) {
                let timeLeft = 60;
                timerEl.innerText = `⏱ 남은 미리보기 스트리밍 시간: ${timeLeft}초`;
                previewTimerInterval = setInterval(() => {
                    timeLeft--;
                    timerEl.innerText = `⏱ 남은 미리보기 스트리밍 시간: ${timeLeft}초`;
                    if (timeLeft <= 0) {
                        closePreviewModal();
                        alert("1분 스트리밍 미리보기 시간이 만료되었습니다. 전체 내용을 보시려면 결제를 진행해 주세요.");
                    }
                }, 1000);
            } else {
                timerEl.innerText = '✅ 무제한 스트리밍 모드';
            }

            const lowerName = productName.toLowerCase();
            const fileUrl = API_URL + filePath;

            if (type === 'physical' || lowerName.endsWith('.png') || lowerName.endsWith('.jpg') || lowerName.endsWith('.jpeg') || lowerName.endsWith('.gif')) {
                viewer.innerHTML = `<img src="${fileUrl}" style="max-width: 100%; max-height: 100%; object-fit: contain;">`;
            } else if (lowerName.endsWith('.mp4') || lowerName.endsWith('.webm') || lowerName.endsWith('.mov')) {
                viewer.innerHTML = `<video src="${fileUrl}" controls autoplay style="max-width: 100%; max-height: 100%; background: #000;"></video>`;
            } else if (lowerName.endsWith('.pdf')) {
                viewer.innerHTML = `<iframe src="${fileUrl}" style="width: 100%; height: 100%; border: none; background:#fff;"></iframe>`;
            } else if (lowerName.endsWith('.stl')) {
                const canvasId = 'three-canvas';
                viewer.innerHTML = `<div id="${canvasId}" style="width:100%; height:100%;"></div><div style="position:absolute; top:10px; left:10px; color:#fff; font-size:12px;">Three.js WebGL 3D 렌더러 동작 중</div>`;
                setTimeout(() => { initThreeJSViewer(canvasId, fileUrl); }, 100);
            } else if (lowerName.endsWith('.dcm') || lowerName.includes('dicom')) {
                const dicomId = 'dicom-canvas';
                viewer.innerHTML = `<div id="${dicomId}" style="width:100%; height:100%;" oncontextmenu="return false"></div><div style="position:absolute; top:10px; left:10px; color:#fff; font-size:12px;">Cornerstone.js DICOM 렌더러 동작 중</div>`;
                setTimeout(() => { initDICOMViewer(dicomId, fileUrl); }, 100);
            } else {
                viewer.innerHTML = `<div style="text-align:center;"><div style="font-size:50px; margin-bottom:10px;">📄</div><div>해당 파일 포맷은 뷰어를 지원하지 않습니다.</div><button class="btn btn-outline" style="margin-top:15px;" onclick="window.open('${fileUrl}', '_blank')">새 탭에서 파일 보기</button></div>`;
            }
        }

        function closePreviewModal() {
            clearInterval(previewTimerInterval);
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('universal-viewer').innerHTML = ''; 
        }

        function initThreeJSViewer(elementId, fileUrl) {
            const container = document.getElementById(elementId);
            const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1c20);
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000); camera.position.set(0, 0, 150);
            const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.AmbientLight(0x404040));
            const light = new THREE.DirectionalLight(0xffffff, 1); light.position.set(1, 1, 1); scene.add(light);
            const loader = new THREE.STLLoader();
            loader.load(fileUrl, function (geometry) {
                const material = new THREE.MeshPhongMaterial({ color: 0x00adb5, specular: 0x111111, shininess: 200 });
                const mesh = new THREE.Mesh(geometry, material);
                geometry.computeBoundingBox(); const center = geometry.boundingBox.getCenter(new THREE.Vector3());
                mesh.position.set(-center.x, -center.y, -center.z); scene.add(mesh);
            });
            function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); } animate();
        }

        function initDICOMViewer(elementId, fileUrl) {
            const element = document.getElementById(elementId); cornerstone.enable(element);
            cornerstone.loadImage('wadouri:' + fileUrl).then(image => { cornerstone.displayImage(element, image); })
            .catch(err => { element.innerHTML = `<div style="padding:20px; color:#ef4444;">DICOM 렌더링 실패: CORS 보안 해제가 필요합니다.</div>`; });
        }
    </script>
</body>
