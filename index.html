<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meta Commerce Platform</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-main: #f3f4f6;
            --panel-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border-color: #e5e7eb;
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --gradient-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px; }
        
        .panel { background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h1, h2, h3 { margin-top: 0; color: var(--text-main); }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-group label { font-size: 13px; font-weight: bold; color: var(--text-sub); }
        .input-group input, .input-group textarea { padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #f8fafc; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-group input:focus, .input-group textarea:focus { border-color: #7c3aed; background: #fff; }
        
        .btn { background: var(--gradient-primary); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; width: 100%; box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2); }
        .btn:hover { background: var(--gradient-hover); transform: translateY(-1px); box-shadow: 0 6px 15px rgba(124, 58, 237, 0.3); }
        .btn-outline { background: #fff; color: #4f46e5; border: 1px solid #4f46e5; box-shadow: none; }
        .btn-outline:hover { background: #f5f3ff; }
        .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; box-shadow: none; }
        .btn-secondary:hover { background: #e2e8f0; }

        .tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 25px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 12px 25px; cursor: pointer; color: var(--text-sub); border-bottom: 3px solid transparent; transition: 0.2s; font-weight: bold; margin-bottom: -2px; white-space: nowrap; }
        .tab.active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }

        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2col { grid-template-columns: 1fr; } }
        
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-height: 600px; overflow-y: auto; padding-right: 5px; }
        .product-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; background: #fff; display: flex; flex-direction: column; transition: 0.3s; }
        .product-card:hover { border-color: #818cf8; box-shadow: 0 8px 24px rgba(99, 102, 241, 0.08); transform: translateY(-2px); }
        .product-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #1e293b; }
        .product-price { font-size: 18px; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; margin-bottom: 12px; }
        .product-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; flex-grow: 1; line-height: 1.5; word-break: keep-all; }
        
        .header-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; padding-bottom: 20px; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px;}
        
        .file-list-box { border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; height: 100px; overflow-y: auto; background: #f8fafc; font-size: 13px; margin-bottom: 15px;}
        .file-item { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; cursor: pointer; color: #4f46e5; font-weight: 500; }
        .file-item:last-child { border-bottom: none; }
        
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 8px; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        .history-table th, .history-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .history-table th { background: #f8fafc; font-weight: 600; color: var(--text-sub); }
        
        .chat-drawer { position: fixed; right: -420px; top: 0; width: 400px; max-width: 100%; height: 100vh; background: #fff; box-shadow: -5px 0 25px rgba(0,0,0,0.1); transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; }
        .chat-drawer.open { right: 0; }
        .chat-header { padding: 20px; background: var(--gradient-primary); color: white; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .chat-close { cursor: pointer; font-size: 24px; line-height: 1; padding: 0 10px;}
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.4; word-break: break-all; }
        .msg-me { background: #e0e7ff; color: #1e3a8a; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #c7d2fe; }
        .msg-other { background: #fff; border: 1px solid var(--border-color); color: #1f2937; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-sender { font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
        .msg-date { font-size: 10px; color: #94a3b8; text-align: right; margin-top: 6px; }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: #fff; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; font-size: 14px;}
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; z-index: 2000; opacity: 0; transition: 0.3s; pointer-events: none;}
        .toast.show { opacity: 1; bottom: 40px; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="panel" id="login-section" style="max-width: 450px; margin: 20px auto; width: 100%;">
            <h2 style="text-align: center; color: #1f2937; font-size: 22px; margin-bottom: 5px;">Platform Sign In</h2>
            <p style="text-align: center; color: var(--text-sub); font-size: 13px; margin-bottom: 30px;">운영 중인 가용 서버 노드와 동기화 처리를 집행합니다.</p>
            
            <div class="input-group">
                <label>이름 (Name)</label>
                <input type="text" id="login-name" placeholder="이름 입력">
            </div>
            <div class="input-group">
                <label>비밀번호 (Password)</label>
                <input type="password" id="login-password" placeholder="비밀번호 입력">
            </div>
            
            <div style="border-top: 1px dashed var(--border-color); margin: 25px 0 15px;"></div>
            <p style="font-size: 12px; color: #6366f1; font-weight: bold; margin-bottom: 10px;">신규 가입자 전용 정산 원장 스펙</p>
            
            <div class="input-group">
                <label>은행명 (Bank)</label>
                <input type="text" id="login-bank" placeholder="예: 신한은행">
            </div>
            <div class="input-group">
                <label>계좌번호 (Account)</label>
                <input type="text" id="login-account" placeholder="예: 110-123-456789">
            </div>
            <button class="btn" style="margin-top: 10px;" onclick="login()">접속하기</button>
        </div>

        <div id="workspace-section" style="display: none;">
            <div class="panel">
                <div class="header-bar">
                    <h1 style="margin: 0; font-size: 22px;">Meta Commerce</h1>
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <span style="font-weight: 600; font-size: 14px; margin-right: 10px;"><span id="display-name" style="color: #6366f1;"></span> 님 계정 정보</span>
                        <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; font-size: 13px;" onclick="location.reload()">로그아웃</button>
                    </div>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab('wallet')">내 지갑</div>
                    <div class="tab" onclick="switchTab('store')">자산 등록</div>
                    <div class="tab" onclick="switchTab('market')">마켓플레이스</div>
                    <div class="tab" onclick="switchTab('history')">거래 내역</div>
                </div>

                <div id="tab-wallet" class="tab-content active">
                    <div style="background: #f8fafc; border-radius: 12px; padding: 40px 20px; text-align: center; border: 1px solid var(--border-color);">
                        <div style="font-size: 14px; font-weight: bold; color: var(--text-sub); margin-bottom: 10px;">연동 원장 계좌: <span id="display-bank"></span> <span id="display-account"></span></div>
                        <div style="font-size: 44px; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; word-break: break-all;"><span id="display-balance">0</span> KRW</div>
                    </div>
                </div>

                <div id="tab-store" class="tab-content">
                    <div class="grid-2col">
                        <div style="border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; background: #fff;">
                            <h3 style="font-size: 16px;">디지털 파일 등록</h3>
                            <div class="input-group">
                                <label>자산 데이터 바인딩</label>
                                <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">
                                <button class="btn btn-secondary" style="margin-bottom: 5px; color: #4f46e5; border-color: #c7d2fe;" onclick="document.getElementById('file-input').click()">PC 파일 연동하기</button>
                                
                                <div class="file-list-box" id="file-list">
                                    <div style="text-align: center; color: #94a3b8; margin-top: 30px;">자산화할 물리 파일을 지정하세요.</div>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>상품명</label>
                                <input type="text" id="file-name" placeholder="파일 선택 시 식별명 자동 파싱">
                            </div>
                            <div class="input-group">
                                <label>판매 금액 (KRW)</label>
                                <input type="number" id="file-price" placeholder="금액 기재">
                            </div>
                            <button class="btn" style="margin-top: 10px;" onclick="registerProduct('file')">자산 파일 등록</button>
                        </div>
                        
                        <div style="border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; background: #fff;">
                            <h3 style="font-size: 16px;">실물 자산 무역 등록</h3>
                            <div class="input-group">
                                <label>자산 품명</label>
                                <input type="text" id="prod-name" placeholder="명칭 기재">
                            </div>
                            <div class="input-group">
                                <label>판매 금액 (KRW)</label>
                                <input type="number" id="prod-price" placeholder="금액 기재">
                            </div>
                            <div class="input-group">
                                <label>스펙 명세서</label>
                                <textarea id="prod-desc" placeholder="상세 사양 서술"></textarea>
                            </div>
                            <button class="btn" style="margin-top: 10px;" onclick="registerProduct('physical')">실물 자산 등록</button>
                        </div>
                    </div>
                </div>

                <div id="tab-market" class="tab-content">
                    <div class="input-group">
                        <input type="text" id="market-search" placeholder="자산 식별명 기반 인덱싱 검색..." onkeyup="loadMarketplace()">
                    </div>
                    <div class="market-grid" id="market-grid"></div>
                </div>

                <div id="tab-history" class="tab-content">
                    <div class="input-group">
                        <input type="text" id="history-search" placeholder="원장 대조 검색..." onkeyup="loadHistory()">
                    </div>
                    <div class="table-wrapper">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>체결 타임스탬프</th>
                                    <th>자산 구분</th>
                                    <th>품명</th>
                                    <th>거래 주체</th>
                                    <th>결제 금액 (KRW)</th>
                                </tr>
                            </thead>
                            <tbody id="history-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="chat-drawer" id="chat-drawer">
        <div class="chat-header">
            <span id="chat-title">채널 동기화</span>
            <span class="chat-close" onclick="closeChat()">&times;</span>
        </div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="패킷 전송..." onkeypress="if(event.keyCode===13) sendMessage()">
            <button class="btn" style="width: auto; margin: 0; padding: 10px 24px;" onclick="sendMessage()">전송</button>
        </div>
    </div>
    
    <div class="toast" id="toast">알림 메시지</div>

    <script>
        // 고정 배포 완료된 AWS 퍼블릭 진성 라우트 엔드포인트 바인딩
        const API_URL = window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '');
        let socket = null;
        let currentUser = null;
        let currentChatRoom = null;
        let currentChatProduct = null;
        let selectedLocalFile = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const clickedTab = document.querySelector(`.tab[onclick="switchTab('${id}')"]`);
            if(clickedTab) clickedTab.add('active');
            const targetContent = document.getElementById(`tab-${id}`);
            if(targetContent) targetContent.add('active');

            if(id === 'market') loadMarketplace();
            if(id === 'history') loadHistory();
        }

        async function login() {
            const name = document.getElementById('login-name').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const bank = document.getElementById('login-bank').value.trim();
            const account = document.getElementById('login-account').value.trim();
            
            if(!name || !password) return showToast("자산 식별 정보를 규정하세요.");

            try {
                const res = await fetch(`${API_URL}/api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password, bank, account })
                });
                
                const data = await res.json();
                if(!res.ok) return showToast(data.error || "인증 세션 거부");
                
                if (!socket) {
                    // 클라이언트 소켓 수동 초기화 타임 오버헤드 통제 옵션 주입
                    socket = io(API_URL, { transports: ['websocket', 'polling'] });
                    socket.on('receive_message', handleReceiveMessage);
                }

                currentUser = data;
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('workspace-section').style.display = 'block';
                
                document.getElementById('display-name').innerText = data.name;
                document.getElementById('display-bank').innerText = data.bank;
                document.getElementById('display-account').innerText = data.account;
                document.getElementById('display-balance').innerText = data.balance.toLocaleString();

            } catch(e) { 
                console.error(e);
                showToast("원격 게이트웨이 동기화 시간 초과. 인프라 인바운드 보안 그룹 구성을 스캔하세요."); 
            }
        }

        async function updateUserBalance() {
            try {
                const res = await fetch(`${API_URL}/api/users/${currentUser.name}`);
                const data = await res.json();
                currentUser.balance = data.balance;
                document.getElementById('display-balance').innerText = data.balance.toLocaleString();
            } catch(e){}
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            const listBox = document.getElementById('file-list');
            listBox.innerHTML = '';
            selectedLocalFile = null;

            if (!file) {
                listBox.innerHTML = '<div style="text-align: center; color: #94a3b8; margin-top: 30px;">선택 파일 부재</div>';
                return;
            }

            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerText = file.name;
            item.style.fontWeight = 'bold';
            item.style.background = '#e0e7ff';
            
            selectedLocalFile = file;
            document.getElementById('file-name').value = file.name;
            listBox.appendChild(item);
        }

        async function registerProduct(type) {
            const formData = new FormData();
            formData.append('id', 'PRD_' + Date.now());
            formData.append('type', type);
            formData.append('seller', currentUser.name);

            if (type === 'file') {
                if(!selectedLocalFile) return showToast("연동할 실제 바이너리 소스를 마운트하세요.");
                const price = document.getElementById('file-price').value;
                if(!price) return showToast("자산 가치 한도를 산정하세요.");

                formData.append('file', selectedLocalFile);
                formData.append('name', document.getElementById('file-name').value || selectedLocalFile.name);
                formData.append('price', price);
                formData.append('description', '디지털 자산 파일');
            } else {
                const name = document.getElementById('prod-name').value;
                const price = document.getElementById('prod-price').value;
                const desc = document.getElementById('prod-desc').value;
                if(!name || !price) return showToast("공백 항목 감지");

                formData.append('name', name);
                formData.append('price', price);
                formData.append('description', desc);
            }

            try {
                showToast("바이너리 스트림 패킷을 서버 원장 스토리지에 적치 중...");
                const res = await fetch(`${API_URL}/api/products`, { method: 'POST', body: formData });
                if(res.ok) {
                    showToast("자산 원장 인덱싱 편입 성료.");
                    document.getElementById('file-name').value = '';
                    document.getElementById('file-price').value = '';
                    document.getElementById('prod-name').value = '';
                    document.getElementById('prod-price').value = '';
                    document.getElementById('prod-desc').value = '';
                    document.getElementById('file-list').innerHTML = '<div style="text-align: center; color: #94a3b8; margin-top: 30px;">자산화할 물리 파일을 지정하세요.</div>';
                    selectedLocalFile = null;
                    switchTab('market');
                } else {
                    showToast("원장 기입 붕괴. 페이로드 용량을 스캔하세요.");
                }
            } catch(e) { showToast("통신 인프라 단절"); }
        }

        async function loadMarketplace() {
            try {
                const res = await fetch(`${API_URL}/api/products`);
                let products = await res.json();
                const query = document.getElementById('market-search').value.toLowerCase();
                
                if(query) {
                    products = products.filter(p => p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
                }

                const grid = document.getElementById('market-grid');
                grid.innerHTML = '';

                if(products.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">자산 데이터 공백 상태</div>';
                    return;
                }

                products.forEach(p => {
                    const isMine = p.seller === currentUser.name;
                    let btnHtml = '';
                    
                    if (isMine) {
                        btnHtml = `
                            <button class="btn btn-outline" style="margin-bottom: 8px;" onclick="openChat('${p.id}', '${p.name}', '${p.seller}')">채널 소켓 모니터링</button>
                            <button class="btn btn-secondary" disabled>보유 소유권 자산</button>
                        `;
                    } else {
                        btnHtml = `
                            <button class="btn btn-outline" style="margin-bottom: 8px;" onclick="openChat('${p.id}', '${p.name}', '${p.seller}')">1:1 가격 협상 채널</button>
                            <button class="btn" onclick="buyProduct('${p.id}', '${p.name}', ${p.price}, '${p.seller}')">소유권 획득 청구</button>
                        `;
                    }

                    const tag = p.type === 'file' ? '💾 자산 원장 파일' : '📦 실물 무역 자산';

                    grid.innerHTML += `
                        <div class="product-card">
                            <div style="font-size: 12px; color: #6366f1; font-weight: bold; margin-bottom: 8px;">${tag}</div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price.toLocaleString()} KRW</div>
                            <div class="product-desc">${p.description}</div>
                            <div style="font-size: 12px; color: #64748b; margin-bottom: 15px; border-top: 1px solid #e2e8f0; padding-top: 10px;">소유 지분권자: <b>${p.seller}</b></div>
                            <div style="margin-top: auto;">${btnHtml}</div>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        async function buyProduct(id, name, price, seller) {
            if (currentUser.balance < price) return showToast("청구 한도(지갑 잔액) 부족.");
            if (confirm(`[${name}] 자산 소유권을 즉각 결제 집행합니까?`)) {
                try {
                    const res = await fetch(`${API_URL}/api/buy`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ buyer: currentUser.name, seller, productId: id, productName: name, amount: price })
                    });
                    
                    // ⭐ [해결 포인트 4] 빈 데이터가 내려왔을 때의 예외 처리 원천 차단
                    const txt = await res.text();
                    if(!txt) throw new Error("Empty Buffer Allocation");
                    const data = JSON.parse(txt);
                    
                    if(res.ok && data.fileLink) {
                        showToast("✅ 스마트 계약 체결. 무손실 전송 게이트가 기동합니다.");
                        updateUserBalance();
                        
                        // 물리 바이너리 스트림 다운로드 강제 유도
                        const link = document.createElement('a');
                        link.href = API_URL + data.fileLink;
                        link.download = name;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        switchTab('history'); 
                    } else showToast(data.error || "계약 체결 거부");
                } catch(e) { showToast("통신 무결성 붕괴"); }
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${API_URL}/api/transactions/${currentUser.name}`);
                const text = await res.text();
                if(!text) return;
                let history = JSON.parse(text);
                
                const query = document.getElementById('history-search').value.toLowerCase();
                if(query) {
                    history = history.filter(h => h.productName.toLowerCase().includes(query) || h.buyer.toLowerCase().includes(query) || h.seller.toLowerCase().includes(query));
                }

                const tbody = document.getElementById('history-body');
                tbody.innerHTML = '';

                if(history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 30px;">원장 대조 내역 공백</td></tr>';
                    return;
                }

                history.forEach(h => {
                    const isBuyer = h.buyer === currentUser.name;
                    const typeHtml = isBuyer 
                        ? '<span style="color: #e11d48; font-weight:bold; background: #ffe4e6; padding: 4px 8px; border-radius: 4px;">지분 매입</span>' 
                        : '<span style="color: #059669; font-weight:bold; background: #d1fae5; padding: 4px 8px; border-radius: 4px;">지분 매각</span>';
                    const counterParty = isBuyer ? h.seller : h.buyer;
                    const amountPrefix = isBuyer ? '-' : '+';

                    tbody.innerHTML += `
                        <tr>
                            <td style="color: #64748b;">${h.date}</td>
                            <td>${typeHtml}</td>
                            <td style="font-weight: 600; color: #1f2937;">${h.productName}</td>
                            <td>${counterParty}</td>
                            <td style="font-weight: bold; color: ${isBuyer ? '#e11d48' : '#059669'};">${amountPrefix} ${h.amount.toLocaleString()}</td>
                        </tr>
                    `;
                });
            } catch(e) {}
        }

        // --- 1:1 진성 대수 구조 채팅 연동 파트 ---
        function openChat(productId, productName, sellerName) {
            currentChatProduct = productId;
            const participants = [currentUser.name, sellerName].sort().join('_');
            currentChatRoom = `room_${productId}_${participants}`;

            document.getElementById('chat-title').innerText = `${productName}`;
            document.getElementById('chat-drawer').classList.add('open');
            
            socket.emit('join_room', currentChatRoom);
            loadChatHistory();
        }

        function closeChat() {
            document.getElementById('chat-drawer').classList.remove('open');
            currentChatRoom = null;
        }

        async function loadChatHistory() {
            try {
                const res = await fetch(`${API_URL}/api/chat/${currentChatRoom}`);
                const text = await res.text();
                if(!res.ok || !text) {
                    document.getElementById('chat-body').innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:20px;">대화 채널 수립 완료. 패킷 전송을 시작하세요.</div>';
                    return;
                }
                
                const messages = JSON.parse(text);
                const chatBody = document.getElementById('chat-body');
                chatBody.innerHTML = '';
                
                if(messages.length === 0) {
                    chatBody.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:20px;">대화 채널 수립 완료. 패킷 전송을 시작하세요.</div>';
                } else {
                    messages.forEach(m => appendMessage(m.sender, m.message, m.date));
                }
            } catch(e) { 
                document.getElementById('chat-body').innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:20px;">대화 채널 수립 완료. 패킷 전송을 시작하세요.</div>';
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg || !currentChatRoom) return;

            const data = {
                roomId: currentChatRoom,
                productId: currentChatProduct,
                sender: currentUser.name,
                message: msg
            };

            socket.emit('send_message', data);
            
            const date = new Date().toLocaleString('ko-KR');
            appendMessage(currentUser.name, msg, date);
            input.value = '';
        }

        function handleReceiveMessage(data) {
            if(data.roomId === currentChatRoom && data.sender !== currentUser.name) {
                const emptyState = document.querySelector('#chat-body div[style*="text-align:center"]');
                if(emptyState) emptyState.remove();
                appendMessage(data.sender, data.message, data.date);
            }
        }

        function appendMessage(sender, text, date) {
            const chatBody = document.getElementById('chat-body');
            const emptyState = chatBody.querySelector('div[style*="text-align:center"]');
            if(emptyState) emptyState.remove();

            const isMe = sender === currentUser.name;
            const bubbleClass = isMe ? 'msg-me' : 'msg-other';
            const senderName = isMe ? '나' : sender;
            
            chatBody.innerHTML += `
                <div class="msg-bubble ${bubbleClass}">
                    <div class="msg-sender">${senderName}</div>
                    <div>${text}</div>
                    <div class="msg-date">${date}</div>
                </div>
            `;
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>
</html>
