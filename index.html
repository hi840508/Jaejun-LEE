<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMJ Meta Commerce</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-main: #f4f5f7;
            --panel-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e2e8f0;
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --gradient-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px; }
        
        .panel { background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2, h3 { margin-top: 0; color: var(--text-main); }
        
        /* 폼 요소 */
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-group label { font-size: 13px; font-weight: bold; color: var(--text-sub); }
        .input-group input, .input-group textarea { padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #f8fafc; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-group input:focus, .input-group textarea:focus { border-color: #7c3aed; }
        
        .btn { background: var(--gradient-primary); color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; width: 100%; box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2); }
        .btn:hover { background: var(--gradient-hover); transform: translateY(-1px); }
        .btn-outline { background: #fff; color: #4f46e5; border: 1px solid #4f46e5; box-shadow: none; }
        .btn-outline:hover { background: #f5f3ff; }

        /* 탭 디자인 */
        .tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 25px; }
        .tab { padding: 12px 25px; cursor: pointer; color: var(--text-sub); border-bottom: 3px solid transparent; transition: 0.2s; font-weight: bold; margin-bottom: -2px; }
        .tab.active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .tab-content { display: none; flex-direction: column; gap: 20px; }
        .tab-content.active { display: flex; }

        /* 마켓 및 그리드 */
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; background: #fff; display: flex; flex-direction: column; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .product-card:hover { border-color: #a78bfa; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.1); }
        .product-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .product-price { font-size: 18px; color: #4f46e5; font-weight: bold; margin-bottom: 10px; }
        .product-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 15px; flex-grow: 1; }

        /* 상품 채팅 서랍 */
        .chat-drawer { position: fixed; right: -400px; top: 0; width: 400px; height: 100vh; background: #fff; box-shadow: -5px 0 25px rgba(0,0,0,0.1); transition: 0.3s; z-index: 1000; display: flex; flex-direction: column; }
        .chat-drawer.open { right: 0; }
        .chat-header { padding: 20px; background: var(--gradient-primary); color: white; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .chat-close { cursor: pointer; font-size: 24px; line-height: 1; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
        .msg-me { background: #e0e7ff; color: #1e3a8a; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background: #fff; border: 1px solid var(--border-color); color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; outline: none; }
        
        /* 거래내역 & 헤더 */
        .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .history-table th, .history-table td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .history-table th { background: #f8fafc; font-weight: bold; color: var(--text-sub); }
        .header-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel" id="login-section">
            <h2 style="text-align: center; color: #4f46e5; font-size: 24px;">Platform Login</h2>
            <p style="text-align: center; color: var(--text-sub); font-size: 14px; margin-bottom: 30px;">이름과 계좌번호를 입력하여 접속하세요.</p>
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="login-name" placeholder="홍길동">
            </div>
            <div class="input-group">
                <label>Account Number</label>
                <input type="text" id="login-account" placeholder="국민 1234-567-890">
            </div>
            <button class="btn" onclick="login()">로그인</button>
        </div>

        <div id="workspace-section" style="display: none;">
            <div class="header-bar">
                <h1 style="margin: 0; font-size: 22px;">Meta Commerce</h1>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <span style="font-weight: bold; color: var(--text-main);"><span id="display-name"></span> 님</span>
                    <button id="btn-admin" class="btn btn-outline" style="display: none; width: auto; padding: 8px 16px;" onclick="showAdminPage()">Admin Gateway</button>
                    <button class="btn" style="width: auto; padding: 8px 16px; background: #94a3b8; box-shadow: none;" onclick="location.reload()">로그아웃</button>
                </div>
            </div>

            <div class="panel">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('wallet')">Wallet</div>
                    <div class="tab" onclick="switchTab('store')">Registration</div>
                    <div class="tab" onclick="switchTab('market')">Marketplace</div>
                    <div class="tab" onclick="switchTab('history')">Transaction History</div>
                </div>

                <div id="tab-wallet" class="tab-content active">
                    <div style="background: var(--bg-main); border-radius: 8px; padding: 30px; text-align: center; border: 1px solid var(--border-color);">
                        <div style="font-size: 14px; color: var(--text-sub); margin-bottom: 10px;">보유 자산 (<span id="display-account"></span>)</div>
                        <div style="font-size: 40px; font-weight: bold; color: #4f46e5;"><span id="display-balance">0</span> KRW</div>
                    </div>
                </div>

                <div id="tab-store" class="tab-content">
                    <div class="grid-2col">
                        <div style="border: 1px solid var(--border-color); padding: 20px; border-radius: 8px;">
                            <h3>디지털 자산 파일 등록</h3>
                            <div class="input-group">
                                <label>파일 선택</label>
                                <input type="file" id="upload-file" webkitdirectory directory multiple>
                                <span style="font-size: 11px; color: var(--text-sub);">* 폴더 또는 파일을 선택하세요.</span>
                            </div>
                            <div class="input-group">
                                <label>상품명</label>
                                <input type="text" id="file-name" placeholder="상품명 입력">
                            </div>
                            <div class="input-group">
                                <label>가격 (KRW)</label>
                                <input type="number" id="file-price" placeholder="금액 입력">
                            </div>
                            <button class="btn" onclick="registerProduct('file')">등록하기</button>
                        </div>
                        
                        <div style="border: 1px solid var(--border-color); padding: 20px; border-radius: 8px;">
                            <h3>실물 상품 등록</h3>
                            <div class="input-group">
                                <label>상품명</label>
                                <input type="text" id="prod-name" placeholder="상품명 입력">
                            </div>
                            <div class="input-group">
                                <label>가격 (KRW)</label>
                                <input type="number" id="prod-price" placeholder="금액 입력">
                            </div>
                            <div class="input-group">
                                <label>상세 설명</label>
                                <textarea id="prod-desc" placeholder="배송 정보 및 설명"></textarea>
                            </div>
                            <button class="btn" onclick="registerProduct('physical')">등록하기</button>
                        </div>
                    </div>
                </div>

                <div id="tab-market" class="tab-content">
                    <div class="input-group">
                        <input type="text" id="market-search" placeholder="상품명을 검색하세요..." onkeyup="loadMarketplace()">
                    </div>
                    <div class="market-grid" id="market-grid"></div>
                </div>

                <div id="tab-history" class="tab-content">
                    <div class="input-group">
                        <input type="text" id="history-search" placeholder="내역 검색..." onkeyup="loadHistory()">
                    </div>
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>일시</th>
                                <th>구분</th>
                                <th>상품명</th>
                                <th>상대방</th>
                                <th>금액 (KRW)</th>
                            </tr>
                        </thead>
                        <tbody id="history-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="admin-section" class="panel" style="display: none;">
            <div class="header-bar">
                <h2>Admin Gateway</h2>
                <button class="btn btn-outline" style="width: auto;" onclick="hideAdminPage()">돌아가기</button>
            </div>
            <p>이재준 관리자 전용 통제 패널입니다.</p>
            </div>

    </div>

    <div class="chat-drawer" id="chat-drawer">
        <div class="chat-header">
            <span id="chat-title">Product Chat</span>
            <span class="chat-close" onclick="closeChat()">&times;</span>
        </div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="메시지 입력..." onkeypress="if(event.keyCode===13) sendMessage()">
            <button class="btn" style="width: auto; margin: 0; padding: 10px 20px;" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:4000'; // AWS 배포 시 해당 IP/도메인으로 변경
        const socket = io(API_URL);
        
        let currentUser = null;
        let currentChatRoom = null;
        let currentChatProduct = null;

        // 탭 전환
        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${id}')"]`).classList.add('active');
            document.getElementById(`tab-${id}`).classList.add('active');

            if(id === 'market') loadMarketplace();
            if(id === 'history') loadHistory();
        }

        // 로그인
        async function login() {
            const name = document.getElementById('login-name').value.trim();
            const account = document.getElementById('login-account').value.trim();
            if(!name || !account) return alert("이름과 계좌번호를 입력하세요.");

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, account })
                });
                const data = await res.json();
                
                currentUser = data;
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('workspace-section').style.display = 'block';
                
                document.getElementById('display-name').innerText = data.name;
                document.getElementById('display-account').innerText = data.account;
                document.getElementById('display-balance').innerText = data.balance.toLocaleString();

                if(data.name === '이재준') {
                    document.getElementById('btn-admin').style.display = 'block';
                }
            } catch(e) { alert("서버 연결 실패"); }
        }

        function showAdminPage() {
            document.getElementById('workspace-section').style.display = 'none';
            document.getElementById('admin-section').style.display = 'block';
        }

        function hideAdminPage() {
            document.getElementById('admin-section').style.display = 'none';
            document.getElementById('workspace-section').style.display = 'block';
        }

        async function updateUserBalance() {
            const res = await fetch(`${API_URL}/api/users/${currentUser.name}`);
            const data = await res.json();
            currentUser.balance = data.balance;
            document.getElementById('display-balance').innerText = data.balance.toLocaleString();
        }

        // 상품 등록
        async function registerProduct(type) {
            const formData = new FormData();
            formData.append('id', 'PRD_' + Date.now());
            formData.append('type', type);
            formData.append('seller', currentUser.name);

            if (type === 'file') {
                const files = document.getElementById('upload-file').files;
                if(files.length === 0) return alert("파일을 선택하세요.");
                formData.append('file', files[0]);
                formData.append('name', document.getElementById('file-name').value || files[0].name);
                formData.append('price', document.getElementById('file-price').value);
                formData.append('desc', '디지털 파일 데이터');
            } else {
                formData.append('name', document.getElementById('prod-name').value);
                formData.append('price', document.getElementById('prod-price').value);
                formData.append('desc', document.getElementById('prod-desc').value);
            }

            try {
                await fetch(`${API_URL}/api/products`, { method: 'POST', body: formData });
                alert("등록이 완료되었습니다.");
                switchTab('market');
            } catch(e) { alert("등록 실패"); }
        }

        // 마켓플레이스 로드
        async function loadMarketplace() {
            const res = await fetch(`${API_URL}/api/products`);
            let products = await res.json();
            const query = document.getElementById('market-search').value.toLowerCase();
            
            if(query) products = products.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));

            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';

            products.forEach(p => {
                const isMine = p.seller === currentUser.name;
                let btnHtml = '';
                
                if (isMine) {
                    btnHtml = `<button class="btn btn-outline" disabled>내 상품</button>`;
                } else {
                    btnHtml = `
                        <button class="btn btn-outline" style="margin-bottom: 8px;" onclick="openChat('${p.id}', '${p.name}', '${p.seller}')">판매자와 협상 채팅</button>
                        <button class="btn" onclick="buyProduct('${p.id}', '${p.name}', ${p.price}, '${p.seller}')">즉시 구매</button>
                    `;
                }

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price.toLocaleString()} KRW</div>
                        <div class="product-desc">${p.desc}<br><br><small>판매자: ${p.seller}</small></div>
                        <div>${btnHtml}</div>
                    </div>
                `;
            });
        }

        // 구매
        async function buyProduct(id, name, price, seller) {
            if (currentUser.balance < price) return alert("잔액이 부족합니다.");
            if (confirm(`[${name}] 상품을 ${price.toLocaleString()}원에 구매하시겠습니까?`)) {
                try {
                    const res = await fetch(`${API_URL}/api/buy`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ buyer: currentUser.name, seller, productId: id, productName: name, amount: price })
                    });
                    const data = await res.json();
                    if(data.success) {
                        alert("구매가 완료되었습니다.");
                        updateUserBalance();
                    } else alert(data.error);
                } catch(e) { alert("서버 오류"); }
            }
        }

        // 거래 내역 로드
        async function loadHistory() {
            const res = await fetch(`${API_URL}/api/transactions/${currentUser.name}`);
            let history = await res.json();
            const query = document.getElementById('history-search').value.toLowerCase();
            
            if(query) history = history.filter(h => h.productName.toLowerCase().includes(query) || h.buyer.toLowerCase().includes(query) || h.seller.toLowerCase().includes(query));

            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';

            history.forEach(h => {
                const isBuyer = h.buyer === currentUser.name;
                const typeText = isBuyer ? '<span style="color: #e11d48; font-weight:bold;">구매 (출금)</span>' : '<span style="color: #10b981; font-weight:bold;">판매 (입금)</span>';
                const counterParty = isBuyer ? h.seller : h.buyer;

                tbody.innerHTML += `
                    <tr>
                        <td>${h.date}</td>
                        <td>${typeText}</td>
                        <td style="font-weight:bold;">${h.productName}</td>
                        <td>${counterParty}</td>
                        <td>${h.amount.toLocaleString()} KRW</td>
                    </tr>
                `;
            });
        }

        // --- 채팅 기능 ---
        function openChat(productId, productName, seller) {
            currentChatProduct = productId;
            // 채팅방 ID 생성 규칙 (판매자와 구매자 간의 해당 상품 전용 방)
            const roomUsers = [currentUser.name, seller].sort().join('_');
            currentChatRoom = `chat_${productId}_${roomUsers}`;

            document.getElementById('chat-title').innerText = `협상: ${productName}`;
            document.getElementById('chat-drawer').classList.add('open');
            
            socket.emit('join_room', currentChatRoom);
            loadChatHistory();
        }

        function closeChat() {
            document.getElementById('chat-drawer').classList.remove('open');
            currentChatRoom = null;
        }

        async function loadChatHistory() {
            const res = await fetch(`${API_URL}/api/chat/${currentChatRoom}`);
            const messages = await res.json();
            
            const chatBody = document.getElementById('chat-body');
            chatBody.innerHTML = '';
            
            messages.forEach(m => appendMessage(m.sender, m.message, m.date));
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg || !currentChatRoom) return;

            const data = {
                roomId: currentChatRoom,
                productId: currentChatProduct,
                sender: currentUser.name,
                message: msg
            };

            socket.emit('send_message', data);
            appendMessage(currentUser.name, msg, new Date().toLocaleString('ko-KR'));
            input.value = '';
        }

        socket.on('receive_message', (data) => {
            if(data.roomId === currentChatRoom) {
                appendMessage(data.sender, data.message, data.date);
            }
        });

        function appendMessage(sender, text, date) {
            const chatBody = document.getElementById('chat-body');
            const isMe = sender === currentUser.name;
            const bubbleClass = isMe ? 'msg-me' : 'msg-other';
            
            chatBody.innerHTML += `
                <div class="msg-bubble ${bubbleClass}">
                    <div class="msg-sender">${sender}</div>
                    <div>${text}</div>
                    <div style="font-size: 10px; color: #94a3b8; text-align: right; margin-top: 4px;">${date}</div>
                </div>
            `;
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>
</html>
