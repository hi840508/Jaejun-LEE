<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARS BANK | Secure Node</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --bg: #05060A; --surface: #11131F; --accent: #FF3B30; --success: #34D399; --text-muted: #8E8E93; --border: #2C2C2E; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }
        .app { width: 100%; max-width: 440px; min-height: 100vh; background: var(--bg); padding: 25px; box-sizing: border-box; position: relative; padding-bottom: 90px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; margin-top: 10px; }
        .logo-wrap { display: flex; align-items: center; gap: 10px; }
        .logo-mars { width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, #FF5E3A, #FF2A68); border-radius: 50%; box-shadow: 0 0 20px rgba(255, 59, 48, 0.4); }
        .logo-title { font-size: 18px; font-weight: 900; letter-spacing: 2px; font-style: italic; color: #fff; }
        .id-badge { background: #1C1C1E; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-family: monospace; color: var(--text-muted); cursor: pointer; }

        .card-main { background: linear-gradient(135deg, #1C1C1E, #0A0A0B); border: 1px solid var(--border); border-radius: 24px; padding: 30px; margin-bottom: 30px; }
        .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; font-weight: 600; }
        .balance-main { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin-bottom: 25px; color: #fff; }
        .sub-bals { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-top: 1px solid var(--border); padding-top: 20px; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .menu-item { background: var(--surface); border: 1px solid var(--border); padding: 25px 15px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.2s; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; }
        .menu-item:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .box { background: var(--surface); padding: 25px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        input, select { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 15px; border-radius: 12px; font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 15px; transition: 0.2s; }
        
        .file-input-btn { width: 100%; background: #2C2C2E; color: #fff; border: 1px dashed #48484A; padding: 20px; border-radius: 12px; font-weight: 600; font-size: 13px; text-align: center; cursor: pointer; display: block; margin-bottom: 15px; }
        .btn-action { width: 100%; background: var(--accent); border: none; padding: 18px; border-radius: 14px; color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(5, 6, 10, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 15px 0 25px 0; z-index: 100; }
        .nav-item { color: var(--text-muted); cursor: pointer; padding: 0 20px; }
        .nav-item.active { color: var(--accent); }

        .svg-icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo-wrap"><div class="logo-mars"></div><div class="logo-title">MARS BANK</div></div>
        <div class="id-badge" id="display-id">ID...</div>
    </div>

    <div id="screen-main" class="screen active">
        <div class="card-main">
            <span class="label">TOTAL USD BALANCE</span>
            <div class="balance-main" id="bal-usd">$ 0.00</div>
            <div class="sub-bals">
                <div><span class="label">STORAGE</span><div style="font-size:18px; font-weight:700;" id="bal-mb">0.00 MB</div></div>
                <div><span class="label">HMJ ASSET</span><div style="font-size:18px; font-weight:700; color:var(--success);" id="bal-hmj">0.000</div></div>
            </div>
        </div>
        <div class="menu-grid">
            <div class="menu-item" onclick="go('screen-mint')">🚀<span style="margin-top:10px; font-weight:700;">MINTING</span></div>
            <div class="menu-item" onclick="go('screen-asset')">💰<span style="margin-top:10px; font-weight:700;">TRANSFER</span></div>
            <div class="menu-item" onclick="go('screen-file')" style="grid-column: span 2; background:linear-gradient(135deg, #11131F, #1C1C1E);">📦<span style="margin-top:10px; font-weight:700;">OFFLINE DATA CUBE (.TXT)</span></div>
        </div>
    </div>

    <div id="screen-file" class="screen">
        <div onclick="go('screen-main')" style="margin-bottom:20px; font-size:14px; cursor:pointer;">← BACK</div>
        <h2 style="margin-top:0;">DATA CUBE PACKAGING</h2>
        
        <div class="box">
            <span class="label">1. CREATE ENVELOPE (.TXT)</span>
            <input type="file" id="f-in" style="display:none;" onchange="updateFileName()">
            <label for="f-in" class="file-input-btn" id="f-label">파일을 선택하세요</label>
            <button class="btn-action" onclick="packageData()">DOWNLOAD .TXT ENVELOPE</button>
        </div>

        <div class="box" style="border-color:var(--success);">
            <span class="label">2. DECRYPT & UNPACK</span>
            <input type="file" id="f-rcv" style="display:none;" accept=".txt" onchange="unpackData()">
            <label for="f-rcv" class="file-input-btn" style="border-color:var(--success); color:var(--success);">받은 .TXT 파일을 업로드하세요</label>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="go('screen-main')">HOME</div>
        <div class="nav-item" onclick="go('screen-ledger')">LEDGER</div>
    </div>
</div>

<script>
    let MY_ID = localStorage.getItem('MARS_BANK_KEY') || ('MARS-'+Math.random().toString(36).substring(2,10).toUpperCase());
    localStorage.setItem('MARS_BANK_KEY', MY_ID);
    document.getElementById('display-id').innerText = MY_ID.substring(0,10);

    function go(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screen-main') sync();
    }

    async function sync() {
        const res = await fetch(`/account/${MY_ID}`);
        const data = await res.json();
        document.getElementById('bal-usd').innerText = `$ ${data.usd.toFixed(2)}`;
        document.getElementById('bal-mb').innerText = `${data.mb.toFixed(2)} MB`;
        document.getElementById('bal-hmj').innerText = data.hmj.toFixed(3);
    }

    function updateFileName() {
        const file = document.getElementById('f-in').files[0];
        document.getElementById('f-label').innerText = file ? file.name : "파일을 선택하세요";
    }

    // 🚀 [해결책] Base64 -> Blob 변환 (모바일 크래시 방지)
    function base64ToBlob(base64, mimeType) {
        const parts = base64.split(';base64,');
        const raw = window.atob(parts[1]);
        const uInt8Array = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; ++i) { uInt8Array[i] = raw.charCodeAt(i); }
        return new Blob([uInt8Array], { type: parts[0].split(':')[1] || mimeType });
    }

    // 1. 데이터 패키징 (.txt 저장)
    async function packageData() {
        const file = document.getElementById('f-in').files[0];
        if(!file) return alert("파일을 선택하세요.");
        
        const sizeMB = (file.size / (1024*1024)).toFixed(2);
        const res = await fetch('/auth-data-emit', { method:'POST', headers:{'Content-Type':'application/json'}, 
            body: JSON.stringify({ accountId: MY_ID, filename: file.name, sizeMB }) });
        const data = await res.json();

        if(res.ok) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const packageObj = {
                    MARS_SIG: "VERIFIED",
                    ticket: data.ticketCode,
                    meta: { name: file.name, type: file.type },
                    payload: e.target.result // Base64
                };
                const blob = new Blob([JSON.stringify(packageObj)], { type: "text/plain" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `${file.name.split('.')[0]}_SECURE.txt`;
                a.click();
                URL.revokeObjectURL(url);
                alert("✅ .TXT 암호화 봉투가 생성되었습니다.\n카카오톡으로 이 파일을 전달하세요.");
                go('screen-main');
            };
            reader.readAsDataURL(file);
        }
    }

    // 2. 데이터 해독 (안정적인 다운로드)
    async function unpackData() {
        const file = document.getElementById('f-rcv').files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const packageObj = JSON.parse(e.target.result);
                if(packageObj.MARS_SIG !== "VERIFIED") throw new Error();

                const res = await fetch('/auth-data-claim', { method:'POST', headers:{'Content-Type':'application/json'}, 
                    body: JSON.stringify({ receiverId: MY_ID, ticketCode: packageObj.ticket }) });
                
                if(res.ok) {
                    // 모바일 안정화: Blob 변환 후 다운로드
                    const blob = base64ToBlob(packageObj.payload);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = packageObj.meta.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    alert("✅ 해독 성공! 파일이 다운로드됩니다.\n이 봉투는 이제 영구 파기되었습니다.");
                    go('screen-main');
                } else {
                    const err = await res.json();
                    alert("⛔ 거부: " + err.error);
                }
            } catch(err) { alert("⛔ 손상되었거나 위조된 봉투입니다."); }
        };
        reader.readAsText(file);
    }

    window.onload = sync;
</script>
</body>
</html>
