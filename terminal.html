<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARS BANK | Universal Asset Node</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --bg: #05060A; --surface: #11131F; --accent: #FF3B30; --accent-dark: #A11812; --success: #34D399; --text-muted: #8E8E93; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }
        .app { width: 100%; max-width: 440px; min-height: 100vh; background: var(--bg); padding: 25px; box-sizing: border-box; }

        /* 🔴 MARS LOGO */
        .header { text-align: center; margin-bottom: 40px; margin-top: 20px; }
        .logo-mars { width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, #FF5E3A, #FF2A68); border-radius: 50%; margin: 0 auto 15px; box-shadow: 0 0 30px rgba(255, 59, 48, 0.4); border: 2px solid rgba(255,255,255,0.1); }
        .logo-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; font-style: italic; color: #fff; }
        
        /* 다국어 선택기 */
        .lang-bar { position: absolute; top: 25px; right: 25px; }
        .lang-select { background: transparent; color: var(--text-muted); border: 1px solid #2C2C2E; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; outline: none; }

        /* 💳 메인 대시보드 */
        .card-main { background: linear-gradient(135deg, #1C1C1E, #0A0A0B); border: 1px solid #2C2C2E; border-radius: 28px; padding: 30px; margin-bottom: 30px; position: relative; overflow: hidden; }
        .card-main::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255, 59, 48, 0.05) 0%, transparent 50%); pointer-events: none; }
        .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; }
        .balance-main { font-size: 42px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 25px; }
        .sub-bals { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-top: 1px solid #2C2C2E; padding-top: 20px; }
        .val-sub { font-size: 18px; font-weight: 700; }

        /* 🔘 메뉴 그리드 */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .menu-item { background: var(--surface); border: 1px solid #2C2C2E; padding: 25px 15px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .menu-item:hover { border-color: var(--accent); transform: translateY(-2px); }
        .icon { font-size: 26px; margin-bottom: 12px; display: block; }
        .m-title { font-size: 14px; font-weight: 700; color: #E5E5EA; }

        /* 📄 페이지 레이아웃 (스크린) */
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .back-btn { font-size: 15px; color: var(--text-muted); cursor: pointer; margin-bottom: 25px; display: inline-block; }

        /* 🧪 타원곡선 채굴 UI */
        .math-box { background: #000; padding: 25px; border-radius: 20px; border: 1px solid #2C2C2E; text-align: center; margin-bottom: 25px; }
        .formula { font-size: 22px; font-family: serif; color: var(--accent); font-weight: bold; margin-bottom: 15px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input { width: 100%; background: #1C1C1E; border: 1px solid #2C2C2E; color: #fff; padding: 15px; border-radius: 12px; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--accent); }
        .btn-action { width: 100%; background: var(--accent); border: none; padding: 18px; border-radius: 14px; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 10px; }
        
        /* 📑 장부 관리 */
        .tab-bar { display: flex; background: #1C1C1E; padding: 5px; border-radius: 12px; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 8px; color: var(--text-muted); }
        .tab.active { background: #2C2C2E; color: #fff; }
        .ledger-item { display: flex; justify-content: space-between; align-items: center; padding: 18px; border-bottom: 1px solid #1C1C1E; }
    </style>
</head>
<body>

<div class="app">
    <div class="lang-bar">
        <select class="lang-select" id="langSelect" onchange="changeLang()">
            <option value="ko">KOR</option>
            <option value="en">ENG</option>
        </select>
    </div>

    <div id="screen-main" class="screen active">
        <div class="header">
            <div class="logo-mars"></div>
            <div class="logo-title">MARS BANK</div>
        </div>

        <div class="card-main">
            <span class="label" data-i18n="bal_usd">TOTAL USD BALANCE</span>
            <div class="balance-main" id="bal-usd">$ 0.00</div>
            <div class="sub-bals">
                <div><span class="label" data-i18n="bal_mb">STORAGE</span><div class="val-sub" id="bal-mb">0.00 MB</div></div>
                <div><span class="label">HMJ ASSET</span><div class="val-sub" style="color:var(--success);" id="bal-hmj">0.000</div></div>
            </div>
        </div>

        <div class="menu-grid">
            <div class="menu-item" onclick="go('screen-mint')"><span class="icon">⛏️</span><span class="m-title" data-i18n="m_mint">HMJ MINTING</span></div>
            <div class="menu-item" onclick="go('screen-asset')"><span class="icon">💰</span><span class="m-title" data-i18n="m_asset">TRANSFER</span></div>
            <div class="menu-item" onclick="go('screen-file')"><span class="icon">📁</span><span class="m-title" data-i18n="m_file">DATA TUNNEL</span></div>
            <div class="menu-item" onclick="go('screen-ledger')"><span class="icon">📑</span><span class="m-title" data-i18n="m_ledger">LEDGERS</span></div>
        </div>
    </div>

    <div id="screen-mint" class="screen">
        <span class="back-btn" onclick="go('screen-main')">← <span data-i18n="back">BACK</span></span>
        <h2 data-i18n="m_mint">HMJ MINTING</h2>
        <div class="math-box">
            <div class="formula">y² = x³ + Ax + B</div>
            <div class="input-row">
                <input type="number" id="m-a" placeholder="Coef A">
                <input type="number" id="m-b" placeholder="Coef B">
            </div>
            <div class="input-row">
                <input type="number" id="m-x" placeholder="Public X">
                <input type="number" id="m-y" placeholder="Private Y">
            </div>
        </div>
        <button class="btn-action" onclick="mint()">VERIFY & MINT 1.000 HMJ</button>
        <p style="font-size:11px; color:var(--text-muted); text-align:center; margin-top:20px;">* ECC secp256k1 proof-of-work required.</p>
    </div>

    <div id="screen-asset" class="screen">
        <span class="back-btn" onclick="go('screen-main')">← <span data-i18n="back">BACK</span></span>
        <h2 data-i18n="m_asset">ASSET TRANSFER</h2>
        <div style="background:var(--surface); padding:20px; border-radius:20px;">
            <label class="label">SEND ASSET</label>
            <div class="input-row" style="grid-template-columns: 1fr 2fr;">
                <select id="as-type" style="background:#1C1C1E; color:#fff; border:1px solid #2C2C2E; border-radius:12px; padding:15px;"><option value="HMJ">HMJ</option><option value="USD">USD</option></select>
                <input type="number" id="as-amt" placeholder="Amount">
            </div>
            <input type="text" id="as-key" placeholder="Create Secret Key for recipient" style="margin-top:10px;">
            <button class="btn-action" onclick="sendAsset()">CREATE ASSET TUNNEL</button>
        </div>
        <div style="background:var(--surface); padding:20px; border-radius:20px; margin-top:15px; border:1px solid #2C2C2E;">
            <label class="label">RECEIVE ASSET</label>
            <input type="text" id="rcv-tid" placeholder="Tunnel ID">
            <input type="text" id="rcv-key" placeholder="Secret Key" style="margin-top:10px;">
            <button class="btn-action" style="background:var(--success);" onclick="claimAsset()">CLAIM ASSET</button>
        </div>
    </div>

    <div id="screen-file" class="screen">
        <span class="back-btn" onclick="go('screen-main')">← <span data-i18n="back">BACK</span></span>
        <h2 data-i18n="m_file">DATA TUNNEL</h2>
        <div style="background:var(--surface); padding:20px; border-radius:20px;">
            <label class="label">UPLOAD DATA</label>
            <input type="file" id="f-in" style="font-size:12px;">
            <button class="btn-action" onclick="sendFile()">EMIT DATA TUNNEL</button>
        </div>
        <div style="background:var(--surface); padding:20px; border-radius:20px; margin-top:15px;">
            <label class="label">DOWNLOAD DATA</label>
            <input type="text" id="f-tid" placeholder="Data Tunnel ID">
            <button class="btn-action" style="background:var(--success);" onclick="receiveFile()">SUMMON DATA</button>
        </div>
    </div>

    <div id="screen-ledger" class="screen">
        <span class="back-btn" onclick="go('screen-main')">← <span data-i18n="back">BACK</span></span>
        <div class="tab-bar">
            <div class="tab active" id="tab-a" onclick="switchLedger('asset')">FINANCE</div>
            <div class="tab" id="tab-f" onclick="switchLedger('file')">DATA</div>
        </div>
        <div id="ledger-list" style="background:var(--surface); border-radius:20px;"></div>
    </div>
</div>

<script>
    const i18n = {
        ko: { bal_usd: "총 달러 잔액", bal_mb: "데이터 용량", m_mint: "HMJ 생성 (채굴)", m_asset: "자산 송금", m_file: "데이터 전송", m_ledger: "장부 관리", back: "돌아가기" },
        en: { bal_usd: "TOTAL USD BALANCE", bal_mb: "STORAGE", m_mint: "HMJ MINTING", m_asset: "TRANSFER", m_file: "DATA TUNNEL", m_ledger: "LEDGERS", back: "BACK" }
    };
    
    let MY_ID = 'MARS-USER-1';

    function changeLang() {
        const lang = document.getElementById('langSelect').value;
        document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = i18n[lang][el.getAttribute('data-i18n')]);
    }

    function go(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screen-main' || id === 'screen-ledger') sync();
    }

    async function sync() {
        const res = await fetch(`/account/${MY_ID}`);
        const data = await res.json();
        document.getElementById('bal-usd').innerText = `$ ${data.usd.toFixed(2)}`;
        document.getElementById('bal-mb').innerText = `${data.mb.toFixed(2)} MB`;
        document.getElementById('bal-hmj').innerText = data.hmj.toFixed(3);
        
        window.history_data = data;
        const activeTab = document.querySelector('.tab.active').id === 'tab-a' ? 'asset' : 'file';
        renderLedger(activeTab);
    }

    function switchLedger(type) {
        document.getElementById('tab-a').classList.toggle('active', type === 'asset');
        document.getElementById('tab-f').classList.toggle('active', type === 'file');
        renderLedger(type);
    }

    function renderLedger(type) {
        const list = type === 'asset' ? window.history_data.asset_history : window.history_data.file_history;
        const container = document.getElementById('ledger-list');
        container.innerHTML = list.map(h => `
            <div class="ledger-item">
                <div><div style="font-weight:700; font-size:14px;">${h.type}</div><div style="font-size:11px; color:var(--text-muted);">${h.time}</div></div>
                <div style="font-weight:800; color:${h.type.includes('RCV')||h.type==='MINT'?'var(--success)':'#fff'}">${h.type.includes('SEND')?'-':'+'}${type==='asset'?h.amount+' '+h.asset : h.size+' MB'}</div>
            </div>`).join('') || '<div style="padding:40px; text-align:center; color:var(--text-muted);">No records.</div>';
    }

    async function mint() {
        const res = await fetch('/mint-hmj', { method: 'POST', headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ accountId: MY_ID, A: document.getElementById('m-a').value, B: document.getElementById('m-b').value, x: document.getElementById('m-x').value, y: document.getElementById('m-y').value }) });
        const data = await res.json();
        if(res.ok) { alert("식 증명 성공! 1.000 HMJ가 발행되었습니다."); go('screen-main'); } else alert(data.error);
    }

    async function sendAsset() {
        const res = await fetch('/transfer-asset', { method: 'POST', headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ senderId: MY_ID, assetType: document.getElementById('as-type').value, amount: document.getElementById('as-amt').value, secretKey: document.getElementById('as-key').value }) });
        const data = await res.json();
        if(res.ok) { alert(`터널 생성! ID: ${data.tunnelId}`); go('screen-main'); } else alert(data.error);
    }

    async function claimAsset() {
        const res = await fetch('/claim-asset', { method: 'POST', headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ receiverId: MY_ID, tunnelId: document.getElementById('rcv-tid').value, inputSecretKey: document.getElementById('rcv-key').value }) });
        if(res.ok) { alert("수령 완료!"); go('screen-main'); } else alert("비밀번호 불일치");
    }

    async function sendFile() {
        const f = document.getElementById('f-in').files[0];
        const res = await fetch('/emit', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ accountId: MY_ID, metadata: { n: f.name, s: f.size } }) });
        const data = await res.json();
        alert(`데이터 터널 생성! ID: ${data.tunnelId}`); go('screen-main');
    }

    async function receiveFile() {
        const tid = document.getElementById('f-tid').value;
        const res = await fetch(`/summon/${tid}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ accountId: MY_ID }) });
        if(res.ok) { alert("데이터 수령 완료! 장부에 기록되었습니다."); go('screen-main'); } else alert("터널 없음");
    }

    window.onload = () => { sync(); changeLang(); };
</script>
</body>
</html>
