<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>RAY Algebraic Bank V3</title>
    <style>
        :root { --primary: #38bdf8; --bg: #020617; --card: #0f172a; --success: #10b981; --danger: #ef4444; --text: #f1f5f9; }
        body { font-family: 'Consolas', monospace; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .terminal { width: 100%; max-width: 1100px; }
        .header-box { background: #000; border: 1px solid #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .account-info { display: flex; gap: 30px; }
        .stat-box { text-align: left; border-left: 2px solid var(--primary); padding-left: 15px; }
        .stat-val { font-size: 20px; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { background: var(--card); padding: 20px; border-radius: 10px; border: 1px solid #1e293b; }
        h2 { font-size: 14px; color: var(--primary); margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        label { font-size: 11px; color: #64748b; margin-bottom: 5px; display: block; }
        input, button { width: 100%; background: #000; border: 1px solid #334155; color: var(--text); padding: 12px; margin-bottom: 15px; border-radius: 6px; box-sizing: border-box; }
        .btn-action { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border:none; }
        
        .ledger-panel { background: #000; border: 1px solid #1e293b; border-radius: 10px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #1e293b; }
        th { color: #64748b; }
        .type-emit { color: #facc15; } .type-rcv { color: var(--success); }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header-box">
        <div>
            <h1 style="margin:0; font-size: 18px; color: var(--primary);">🏦 ALGEBRAIC BANK</h1>
            <div style="font-size: 12px; color: #64748b; margin-top:5px;">ID: <span id="accIdDisplay" style="color: #fff;"></span></div>
        </div>
        <div class="account-info">
            <div class="stat-box"><div class="stat-val" id="statEmitted">0.00 MB</div><div class="stat-label">총 송금 자산 (Emitted)</div></div>
            <div class="stat-box"><div class="stat-val" id="statReceived" style="color:var(--success);">0.00 MB</div><div class="stat-label">총 수신 자산 (Received)</div></div>
            <div class="stat-box"><div class="stat-val" id="statActive" style="color:#facc15;">0</div><div class="stat-label">활성 차원 (대기중)</div></div>
        </div>
    </div>

    <div class="grid">
        <div class="panel">
            <h2>1. Emission (데이터 송금)</h2>
            <input type="file" id="fileInput">
            <div style="display: flex; gap: 10px;"><input type="number" id="sr" value="19"><input type="number" id="ss" value="11"></div>
            <button class="btn-action" onclick="emitAsset()">차원 투영 및 송금</button>
            <div id="finalKey" style="text-align: center; color: #facc15; font-size: 20px; font-weight: bold; margin-top:10px;"></div>
        </div>

        <div class="panel">
            <h2>2. Materialization (데이터 수신)</h2>
            <input type="text" id="keyInput" placeholder="열쇠 입력 (RAY-XXXXX-XXXX)">
            <button class="btn-action" style="background: var(--success);" onclick="materializeAsset()">열쇠로 실체화</button>
            <div id="resultBox" style="margin-top: 15px;"></div>
        </div>
    </div>

    <div class="ledger-panel">
        <h2>📑 Transaction Ledger (이체 내역)</h2>
        <table>
            <thead><tr><th>시간</th><th>구분</th><th>터널 ID (열쇠)</th><th>파일명</th><th>크기</th></tr></thead>
            <tbody id="ledgerBody">
                <tr><td colspan="5" style="text-align:center; color:#64748b;">내역이 없습니다.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SERVER_URL = window.location.origin;
    
    // 🔑 [핵심] 브라우저 지문(통장) 자동 발급 및 로드
    let MY_ACCOUNT_ID = localStorage.getItem('RAY_BANK_ACCOUNT');
    if (!MY_ACCOUNT_ID) {
        MY_ACCOUNT_ID = 'RAY-USER-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('RAY_BANK_ACCOUNT', MY_ACCOUNT_ID);
    }
    document.getElementById('accIdDisplay').innerText = MY_ACCOUNT_ID;

    // 🔄 장부 및 잔고 동기화 함수
    async function syncAccount() {
        try {
            const res = await fetch(`${SERVER_URL}/account/${MY_ACCOUNT_ID}`);
            const data = await res.json();
            
            document.getElementById('statEmitted').innerText = `${data.totalEmitted.toFixed(2)} MB`;
            document.getElementById('statReceived').innerText = `${data.totalReceived.toFixed(2)} MB`;
            document.getElementById('statActive').innerText = data.activeTunnels;

            const tbody = document.getElementById('ledgerBody');
            if (data.history.length > 0) {
                tbody.innerHTML = data.history.map(h => `
                    <tr>
                        <td>${h.time}</td>
                        <td class="${h.type.includes('EMIT') ? 'type-emit' : 'type-rcv'}"><b>${h.type}</b></td>
                        <td>${h.tunnel}</td>
                        <td>${h.file}</td>
                        <td>${h.size}</td>
                    </tr>
                `).join('');
            }
        } catch(e) { console.log("서버 오프라인"); }
    }

    // 투영 로직
    async function emitAsset() {
        const fileIn = document.getElementById('fileInput');
        if (fileIn.files.length === 0) return alert("파일을 선택하세요.");
        const f = fileIn.files[0];
        
        const r = parseInt(document.getElementById('sr').value);
        const s = parseInt(document.getElementById('ss').value);
        const U = Math.floor(Math.pow((r*r + s*s)/2, 2));
        
        const bytes = new Uint8Array(await f.arrayBuffer());
        const matrix = Array.from(bytes).map(b => ({ x: Math.floor(b / U), d: b % U }));
        const meta = { n: f.name, t: f.type, s: f.size };

        const res = await fetch(`${SERVER_URL}/emit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accountId: MY_ACCOUNT_ID, matrix, scale: U, metadata: meta })
        });
        const { tunnelId } = await res.json();
        document.getElementById('finalKey').innerText = `발급된 열쇠: RAY-${tunnelId}-${r}${s}`;
        syncAccount(); // 송금 후 장부 갱신
    }

    // 수신 로직
    async function materializeAsset() {
        const key = document.getElementById('keyInput').value.split('-');
        if (key.length < 3) return;
        const tunnelId = key[1];

        try {
            const res = await fetch(`${SERVER_URL}/summon/${tunnelId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accountId: MY_ACCOUNT_ID }) // 수신자 신분증 제시
            });
            if (!res.ok) throw new Error();
            
            const slot = await res.json();
            const U = slot.scale;
            const restored = new Uint8Array(slot.matrix.map(m => (m.x * U) + m.d));
            
            const blob = new Blob([restored], { type: slot.metadata.t });
            const url = URL.createObjectURL(blob);
            document.getElementById('resultBox').innerHTML = `<a href="${url}" download="${slot.metadata.n}" style="color:var(--success); font-weight:bold; font-size:16px;">📥 ${slot.metadata.n} 다운로드 완료</a>`;
            
            syncAccount(); // 수신 후 장부 갱신
        } catch(e) { alert("만료된 열쇠입니다."); }
    }

    // 접속 시 장부 동기화 시작
    syncAccount();
</script>
</body>
</html>
