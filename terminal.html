<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAY Global Wallet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --bg: #F3F4F6; --surface: #FFFFFF; --text-main: #111827; --text-sub: #6B7280; --primary: #3B82F6; --success: #10B981; --border: #E5E7EB; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 440px; min-height: 100vh; background: var(--surface); position: relative; padding: 20px; box-sizing: border-box; overflow-x: hidden; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .lang-select { border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; outline: none; background: var(--bg); }

        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: linear-gradient(135deg, #111827, #1F2937); color: white; border-radius: 20px; padding: 30px; margin-bottom: 24px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .label { font-size: 13px; color: #9CA3AF; margin-bottom: 8px; font-weight: 500; }
        .val { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 20px; }
        .sub-bals { display: flex; gap: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .menu-btn { background: var(--bg); border: 1px solid var(--border); padding: 20px; border-radius: 16px; text-align: center; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { border-color: var(--primary); color: var(--primary); }

        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-family: inherit; font-size: 14px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn-full { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-full:active { transform: scale(0.98); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); margin-top: 10px; }
        
        .tx-item { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
        .tx-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .tx-date { font-size: 12px; color: var(--text-sub); }
        .tx-amt { font-weight: 700; font-size: 16px; }
        
        .header-back { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; margin-bottom: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app">
    <div class="top-nav">
        <div class="logo">RAY BANK</div>
        <select class="lang-select" id="langSelect" onchange="changeLang()">
            <option value="ko">KOR</option>
            <option value="en">ENG</option>
        </select>
    </div>

    <div id="screen-main" class="screen active">
        <div class="card">
            <div class="label" data-i18n="bal_usd">Total USD Balance</div>
            <div class="val" id="bal-usd">$ 0.00</div>
            <div class="sub-bals">
                <div><div class="label" data-i18n="bal_mb">Storage</div><div style="font-size:20px; font-weight:700;" id="bal-mb">0.00 MB</div></div>
                <div><div class="label">HMJ Asset</div><div style="font-size:20px; font-weight:700; color:#34D399;" id="bal-hmj">0.000</div></div>
            </div>
        </div>

        <div class="menu-grid">
            <div class="menu-btn" onclick="showScreen('screen-mint')">⛏️ <div style="margin-top:8px;" data-i18n="nav_mint">HMJ 자산 생성</div></div>
            <div class="menu-btn" onclick="showScreen('screen-transfer')">📤 <div style="margin-top:8px;" data-i18n="nav_send">자산 전송/수신</div></div>
            <div class="menu-btn" onclick="showScreen('screen-ledger')" style="grid-column: span 2;">📑 <span data-i18n="nav_ledger">전체 거래 내역 보기</span></div>
        </div>
    </div>

    <div id="screen-mint" class="screen">
        <div class="header-back" onclick="showScreen('screen-main')">← <span data-i18n="mint_title">HMJ 대수학적 생성</span></div>
        <p style="font-size:13px; color:#6B7280; margin-bottom:20px;" data-i18n="mint_desc">타원 곡선(secp256k1) 수식이 성립하는 완벽한 키 쌍을 입력하면 1.000 HMJ가 발행됩니다.</p>
        
        <button class="btn-full btn-outline" style="margin-bottom:20px;" onclick="generateTestKeys()" data-i18n="btn_gen_key">테스트용 ECC 키 쌍 생성하기</button>
        
        <div class="form-group"><input type="text" id="mint-pub" placeholder="Public Key (Hex)"></div>
        <div class="form-group"><input type="text" id="mint-priv" placeholder="Private Key (Hex)"></div>
        <button class="btn-full" onclick="mintHMJ()" data-i18n="btn_verify">수식 검증 및 HMJ 발행</button>
    </div>

    <div id="screen-transfer" class="screen">
        <div class="header-back" onclick="showScreen('screen-main')">← <span data-i18n="nav_send">자산 송수신 관리</span></div>
        
        <div style="background:#F9FAFB; padding:20px; border-radius:16px; margin-bottom:20px; border:1px solid var(--border);">
            <h3 style="margin-top:0;" data-i18n="tx_send_title">자산 전송 (Escrow)</h3>
            <div class="form-group">
                <select id="tx-asset">
                    <option value="HMJ">HMJ (화폐)</option>
                    <option value="USD">USD (달러)</option>
                    <option value="MB">MB (용량)</option>
                </select>
            </div>
            <div class="form-group"><input type="number" id="tx-amt" placeholder="전송할 수량"></div>
            <div class="form-group"><input type="text" id="tx-secret" placeholder="수령자가 입력해야 할 비밀키 설정"></div>
            <button class="btn-full" onclick="transferAsset()" data-i18n="btn_send">자산 터널 생성</button>
        </div>

        <div style="background:#F9FAFB; padding:20px; border-radius:16px; border:1px solid var(--border);">
            <h3 style="margin-top:0;" data-i18n="tx_rcv_title">자산 수신 (Claim)</h3>
            <div class="form-group"><input type="text" id="rcv-tunnel" placeholder="터널 ID"></div>
            <div class="form-group"><input type="text" id="rcv-secret" placeholder="설정된 비밀키 입력"></div>
            <button class="btn-full" style="background:var(--success);" onclick="claimAsset()" data-i18n="btn_rcv">비밀키로 자산 수령</button>
        </div>
    </div>

    <div id="screen-ledger" class="screen">
        <div class="header-back" onclick="showScreen('screen-main')">← <span data-i18n="nav_ledger">거래 내역</span></div>
        <div id="ledger-list"></div>
    </div>
</div>

<script>
    const i18n = {
        ko: { bal_usd: "총 달러 잔고", bal_mb: "보유 데이터 용량", nav_mint: "HMJ 자산 생성", nav_send: "자산 송수신 관리", nav_ledger: "전체 거래 내역 보기", mint_title: "HMJ 대수학적 생성", mint_desc: "타원 곡선(secp256k1) 수식이 성립하는 완벽한 키 쌍을 입력하면 1.000 HMJ가 발행됩니다.", btn_gen_key: "테스트용 ECC 키 쌍 생성하기", btn_verify: "수식 검증 및 HMJ 발행", tx_send_title: "자산 전송 (Escrow)", btn_send: "자산 터널 생성", tx_rcv_title: "자산 수신 (Claim)", btn_rcv: "비밀키로 자산 수령" },
        en: { bal_usd: "Total USD Balance", bal_mb: "Storage", nav_mint: "Mint HMJ Asset", nav_send: "Transfer Assets", nav_ledger: "View All Transactions", mint_title: "Algebraic HMJ Minting", mint_desc: "Enter a valid secp256k1 key pair. If P = d*G holds, 1.000 HMJ is minted.", btn_gen_key: "Generate Test ECC Key Pair", btn_verify: "Verify Math & Mint HMJ", tx_send_title: "Send Asset (Escrow)", btn_send: "Create Asset Tunnel", tx_rcv_title: "Receive Asset (Claim)", btn_rcv: "Claim with Secret Key" }
    };

    let MY_ID = 'RAY-USER-1'; // 테스트용 고정 계정

    function changeLang() {
        const lang = document.getElementById('langSelect').value;
        document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = i18n[lang][el.getAttribute('data-i18n')]);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screen-main' || id === 'screen-ledger') syncAccount();
    }

    async function syncAccount() {
        const res = await fetch(`/account/${MY_ID}`);
        const data = await res.json();
        document.getElementById('bal-usd').innerText = `$ ${data.usd.toFixed(2)}`;
        document.getElementById('bal-mb').innerText = `${data.mb.toFixed(2)} MB`;
        document.getElementById('bal-hmj').innerText = data.hmj.toFixed(3);

        document.getElementById('ledger-list').innerHTML = data.history.map(h => `
            <div class="tx-item">
                <div><div class="tx-title">${h.type}</div><div class="tx-date">${h.time}</div></div>
                <div class="tx-amt" style="color:${h.type.includes('RCV')||h.type==='MINT'?'var(--success)':'var(--text-main)'}">${h.type.includes('SEND')?'-':'+'}${h.amount} ${h.asset}</div>
            </div>
        `).join('');
    }

    // 시연을 위한 실제 타원 곡선 키 쌍 생성 (서버 API 호출)
    async function generateTestKeys() {
        const res = await fetch('/generate-keypair');
        const keys = await res.json();
        document.getElementById('mint-pub').value = keys.publicKey;
        document.getElementById('mint-priv').value = keys.privateKey;
        alert("실제 secp256k1 타원 곡선 알고리즘에 기반한 무작위 16진수 키 쌍이 생성되었습니다.\n이제 하단의 [수식 검증] 버튼을 눌러보세요.");
    }

    async function mintHMJ() {
        const res = await fetch('/mint-hmj', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ accountId: MY_ID, publicKey: document.getElementById('mint-pub').value, privateKey: document.getElementById('mint-priv').value })
        });
        const result = await res.json();
        if(res.ok) { alert("대수학적 검증 성공! 1.000 HMJ가 발행되었습니다."); showScreen('screen-main'); }
        else alert(`검증 실패: ${result.error}`);
    }

    async function transferAsset() {
        const res = await fetch('/transfer-asset', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ senderId: MY_ID, assetType: document.getElementById('tx-asset').value, amount: document.getElementById('tx-amt').value, secretKey: document.getElementById('tx-secret').value })
        });
        const result = await res.json();
        if(res.ok) { alert(`자산이 분리되었습니다.\n상대방에게 터널 ID [ ${result.tunnelId} ] 와 설정한 비밀키를 전달하세요.`); showScreen('screen-main'); }
        else alert(result.error);
    }

    async function claimAsset() {
        const res = await fetch('/claim-asset', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ receiverId: MY_ID, tunnelId: document.getElementById('rcv-tunnel').value, inputSecretKey: document.getElementById('rcv-secret').value })
        });
        const result = await res.json();
        if(res.ok) { alert("비밀키가 일치합니다! 자산을 성공적으로 수령했습니다."); showScreen('screen-main'); }
        else alert(result.error);
    }

    window.onload = () => { syncAccount(); changeLang(); };
</script>
</body>
</html>
