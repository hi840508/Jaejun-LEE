<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OYP Unified Platform | RAYCloud x MARS</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --bg: #09090b; --panel: #18181b; --primary: #3b82f6; --accent: #10b981; --text: #f8fafc; --border: #27272a; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 220px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .nav-item { padding: 18px 20px; cursor: pointer; border-bottom: 1px solid var(--border); color: #94a3b8; font-weight: 700; transition: 0.2s; }
        .nav-item.active { background: rgba(59,130,246,0.1); color: var(--primary); border-right: 4px solid var(--primary); }
        
        /* Main */
        .main-content { flex: 1; display: flex; flex-direction: column; background: #000; }
        .top-bar { height: 60px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
        .view-section { display: none; padding: 25px; flex: 1; overflow-y: auto; }
        .view-section.active { display: block; }

        #login-overlay { position: fixed; inset:0; background:rgba(0,0,0,0.95); z-index:9999; display:flex; justify-content:center; align-items:center; }
        .login-box { background: var(--panel); padding: 40px; border-radius: 12px; border: 1px solid var(--primary); text-align: center; width: 320px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2 style="color:var(--primary); margin-top:0;">OYP NODE ACCESS</h2>
        <input type="text" id="loginId" placeholder="아이디 (Wallet ID)">
        <input type="password" id="loginKey" placeholder="숫자 암호키 (d)">
        <button onclick="login()">통합 네트워크 접속</button>
    </div>
</div>

<div class="sidebar">
    <div style="padding:20px; font-weight:900; color:var(--primary); font-size:20px;">OYP PLATFORM</div>
    <div class="nav-item active" onclick="tab('manage')">📁 데이터 관리</div>
    <div class="nav-item" onclick="tab('view')">👁️ 데이터 보기</div>
    <div class="nav-item" onclick="tab('trade')">🤝 데이터 거래</div>
    <div class="nav-item" onclick="tab('asset')">💸 자산 송금/입금</div>
</div>

<div class="main-content">
    <div class="top-bar">
        <strong id="header-user">접속 대기</strong>
        <div style="display:flex; gap:20px;">
            <span style="color:var(--accent);">💎 <span id="bal-hmj">0</span> HMJ</span>
            <span style="color:#F59E0B;">💵 $<span id="bal-usd">0</span></span>
        </div>
    </div>

    <div id="tab-manage" class="view-section active">
        <div style="background:var(--panel); padding:20px; border-radius:8px;">
            <h3>MARS-1 암호화 업로드</h3>
            <input type="file" id="upFile">
            <button onclick="upload()">대수기하학적 암호화 전송</button>
        </div>
    </div>

    <div id="tab-view" class="view-section">
        <div id="viewer" style="width:100%; height:500px; background:#111; border-radius:8px;"></div>
    </div>

    <div id="tab-asset" class="view-section">
        <div style="background:var(--panel); padding:20px; border-radius:8px;">
            <h3>금융 장부 히스토리</h3>
            <div id="history" style="font-size:13px; color:#94a3b8;"></div>
        </div>
    </div>
</div>

<script>
    let MY_ID = '', MY_KEY = 0;
    const socket = io();

    async function login() {
        MY_ID = document.getElementById('loginId').value;
        MY_KEY = parseInt(document.getElementById('loginKey').value);
        const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ accountId: MY_ID }) });
        const acc = await res.json();
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('header-user').innerText = `ID: ${MY_ID}`;
        updateUI(acc);
    }

    function tab(id) {
        document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('tab-'+id).classList.add('active');
    }

    function updateUI(acc) {
        document.getElementById('bal-hmj').innerText = acc.hmj.toFixed(2);
        document.getElementById('bal-usd').innerText = acc.usd.toLocaleString();
        document.getElementById('history').innerHTML = acc.history.map(h => `<div>[${h.time}] ${h.detail}</div>`).join('');
    }

    async function upload() {
        const file = document.getElementById('upFile').files[0];
        const formData = new FormData();
        formData.append('file', file);
        formData.append('uploaderId', MY_ID);
        formData.append('Ad', 5 + MY_KEY); // MARS-1 수식 적용
        formData.append('Bd', 7 - (MY_KEY * file.name.length));
        await fetch('/api/data/upload', { method: 'POST', body: formData });
        alert("데이터가 암호화되어 클라우드에 등록되었습니다.");
    }
</script>
</body>
</html>
