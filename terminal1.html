<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAY Algebraic Bank</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { 
            --bg-base: #0B0D13; 
            --surface: #151822; 
            --surface-hover: #1E2230;
            --primary: #3B82F6; 
            --primary-gradient: linear-gradient(135deg, #2563eb, #3b82f6);
            --success: #10B981; 
            --warning: #F59E0B;
            --text-main: #F8FAFC; 
            --text-muted: #94A3B8; 
            --border: #262A3D;
        }
        
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-base); color: var(--text-main); margin: 0; padding: 40px 20px; display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }
        .app-container { width: 100%; max-width: 1000px; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 🏦 탑 네비게이션 */
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .nav-bar h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        .status-badge { background: rgba(16, 185, 129, 0.1); color: var(--success); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.2); }

        /* 💳 디지털 지갑 (Asset Card) */
        .wallet-card { background: var(--primary-gradient); border-radius: 24px; padding: 35px; margin-bottom: 30px; position: relative; overflow: hidden; box-shadow: 0 20px 40px rgba(37, 99, 235, 0.2); }
        .wallet-card::after { content: ''; position: absolute; top: -50%; right: -20%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); border-radius: 50%; }
        .wallet-label { font-size: 14px; color: rgba(255,255,255,0.8); font-weight: 500; margin-bottom: 5px; }
        .wallet-balance { font-size: 42px; font-weight: 800; letter-spacing: -1px; margin-bottom: 25px; }
        
        .credential-box { background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 12px; display: inline-flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .credential-box:hover { background: rgba(0,0,0,0.3); }
        .credential-text { font-family: monospace; font-size: 14px; color: #E2E8F0; }

        .stats-row { display: flex; gap: 30px; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .stat-group { display: flex; flex-direction: column; }
        .stat-value { font-size: 20px; font-weight: 700; }

        /* 🎛️ 액션 패널 (송/수신) */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px; transition: transform 0.2s; }
        .panel:hover { border-color: #374151; }
        .panel h2 { margin: 0 0 20px 0; font-size: 16px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; background: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); padding: 14px 16px; border-radius: 12px; font-size: 14px; font-family: inherit; margin-bottom: 15px; box-sizing: border-box; outline: none; transition: all 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .btn { width: 100%; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary-gradient); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .btn-success:hover { background: rgba(16, 185, 129, 0.2); }

        .key-display { background: var(--bg-base); border: 1px dashed var(--warning); color: var(--warning); padding: 15px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 16px; margin-top: 10px; display: none; }

        /* 📑 이체 내역 (List View) */
        .ledger-section { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px; }
        .ledger-section h2 { margin: 0 0 20px 0; font-size: 18px; font-weight: 700; }
        .ledger-list { display: flex; flex-direction: column; gap: 12px; }
        .ledger-item { background: var(--bg-base); padding: 18px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .ledger-item:hover { border-color: var(--border); background: var(--surface-hover); }
        
        .ledger-left { display: flex; align-items: center; gap: 15px; }
        .icon-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .icon-emit { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .icon-rcv { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        
        .ledger-info { display: flex; flex-direction: column; gap: 4px; }
        .ledger-title { font-weight: 600; font-size: 15px; color: var(--text-main); }
        .ledger-meta { font-size: 12px; color: var(--text-muted); }
        
        .ledger-amount { font-weight: 700; font-size: 16px; }
        .amt-emit { color: var(--text-main); }
        .amt-rcv { color: var(--success); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-bar">
        <h1>🏦 ALGEBRAIC BANK</h1>
        <div class="status-badge">● Secure Network Active</div>
    </div>

    <div class="wallet-card">
        <div class="wallet-label">Total Handled Assets</div>
        <div class="wallet-balance" id="totalBalance">0.00 <span style="font-size:20px; font-weight:500; opacity:0.8;">MB</span></div>
        
        <div class="credential-box" onclick="copyCredential()" title="클릭하여 복사">
            <span style="font-size:16px;">🔑</span>
            <span class="credential-text" id="accIdDisplay">인증 정보를 불러오는 중...</span>
        </div>

        <div class="stats-row">
            <div class="stat-group">
                <span class="wallet-label" style="font-size:12px;">Emitted (송금)</span>
                <span class="stat-value" id="statEmitted">0.00 MB</span>
            </div>
            <div class="stat-group">
                <span class="wallet-label" style="font-size:12px;">Received (수신)</span>
                <span class="stat-value" id="statReceived">0.00 MB</span>
            </div>
            <div class="stat-group">
                <span class="wallet-label" style="font-size:12px;">Active Tunnels</span>
                <span class="stat-value" id="statActive">0</span>
            </div>
        </div>
    </div>

    <div class="action-grid">
        <div class="panel">
            <h2>📤 Emission (데이터 자산 송금)</h2>
            <label>자산 파일 첨부</label>
            <input type="file" id="fileInput">
            <div style="display: flex; gap: 15px;">
                <div style="flex:1;"><label>정밀도 R</label><input type="number" id="sr" value="19"></div>
                <div style="flex:1;"><label>분해능 S</label><input type="number" id="ss" value="11"></div>
            </div>
            <button class="btn btn-primary" onclick="emitAsset()">차원 투영 및 송금</button>
            <div id="finalKey" class="key-display"></div>
        </div>

        <div class="panel">
            <h2>📥 Materialization (데이터 자산 수신)</h2>
            <label>일회용 소환 열쇠 (One-time Key)</label>
            <input type="text" id="keyInput" placeholder="RAY-XXXXX-XXXX">
            <button class="btn btn-success" onclick="materializeAsset()">열쇠로 자산 실체화</button>
            <div id="resultBox" style="margin-top: 15px; text-align: center;"></div>
        </div>
    </div>

    <div class="ledger-section">
        <h2>📑 Transaction History</h2>
        <div class="ledger-list" id="ledgerBody">
            <div class="empty-state">장부를 동기화하는 중입니다...</div>
        </div>
    </div>
</div>

<script>
    const SERVER_URL = window.location.origin;
    let MY_ACCOUNT_ID = null;

    async function initCredential() {
        let privateKey = localStorage.getItem('RAY_BANK_PRIVATE_KEY');
        if (!privateKey) {
            const array = new Uint32Array(4);
            window.crypto.getRandomValues(array);
            privateKey = 'RAY-' + Array.from(array).map(n => n.toString(36)).join('-').toUpperCase();
            localStorage.setItem('RAY_BANK_PRIVATE_KEY', privateKey);
        }
        MY_ACCOUNT_ID = privateKey;
        // 보안을 위해 앞부분만 보여주고 마스킹 처리
        const maskedID = MY_ACCOUNT_ID.substring(0, 13) + '••••••••';
        document.getElementById('accIdDisplay').innerText = maskedID;
        syncAccount();
    }

    function copyCredential() {
        navigator.clipboard.writeText(MY_ACCOUNT_ID);
        alert("내 지갑의 마스터 키가 복사되었습니다.\n절대 타인에게 노출하지 마십시오.");
    }

    async function syncAccount() {
        try {
            const res = await fetch(`${SERVER_URL}/account/${MY_ACCOUNT_ID}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            
            const total = data.totalEmitted + data.totalReceived;
            document.getElementById('totalBalance').innerHTML = `${total.toFixed(2)} <span style="font-size:20px; font-weight:500; opacity:0.8;">MB</span>`;
            document.getElementById('statEmitted').innerText = `${data.totalEmitted.toFixed(2)} MB`;
            document.getElementById('statReceived').innerText = `${data.totalReceived.toFixed(2)} MB`;
            document.getElementById('statActive').innerText = data.activeTunnels;

            const list = document.getElementById('ledgerBody');
            if (data.history.length > 0) {
                list.innerHTML = data.history.map(h => {
                    const isEmit = h.type.includes('EMIT');
                    return `
                    <div class="ledger-item">
                        <div class="ledger-left">
                            <div class="icon-circle ${isEmit ? 'icon-emit' : 'icon-rcv'}">${isEmit ? '📤' : '📥'}</div>
                            <div class="ledger-info">
                                <div class="ledger-title">${h.file}</div>
                                <div class="ledger-meta">${h.time} &middot; 터널 ID: ${h.tunnel}</div>
                            </div>
                        </div>
                        <div class="ledger-amount ${isEmit ? 'amt-emit' : 'amt-rcv'}">
                            ${isEmit ? '-' : '+'}${h.size}
                        </div>
                    </div>`;
                }).join('');
            } else {
                list.innerHTML = `<div class="empty-state">아직 거래 내역이 없습니다. 첫 자산을 송금해 보세요.</div>`;
            }
        } catch(e) {
            console.error("서버 연결 실패");
        }
    }

    async function emitAsset() {
        const fileIn = document.getElementById('fileInput');
        if (fileIn.files.length === 0) return alert("파일을 첨부해 주십시오.");
        
        const btn = event.target;
        btn.innerHTML = "처리 중..."; btn.disabled = true;

        const f = fileIn.files[0];
        const r = parseInt(document.getElementById('sr').value);
        const s = parseInt(document.getElementById('ss').value);
        const U = Math.floor(Math.pow((r*r + s*s)/2, 2));
        
        const bytes = new Uint8Array(await f.arrayBuffer());
        const matrix = Array.from(bytes).map(b => ({ x: Math.floor(b / U), d: b % U }));
        const meta = { n: f.name, t: f.type, s: f.size };

        try {
            const res = await fetch(`${SERVER_URL}/emit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accountId: MY_ACCOUNT_ID, matrix, scale: U, metadata: meta })
            });
            const { tunnelId } = await res.json();
            const keyBox = document.getElementById('finalKey');
            keyBox.style.display = 'block';
            keyBox.innerText = `발급 열쇠: RAY-${tunnelId}-${r}${s}`;
            syncAccount();
        } catch(e) {
            alert("전송 실패: 파일이 너무 큽니다.");
        } finally {
            btn.innerHTML = "차원 투영 및 송금"; btn.disabled = false;
        }
    }

    async function materializeAsset() {
        const fullKey = document.getElementById('keyInput').value;
        const parts = fullKey.split('-');
        if (parts.length < 3) return alert("정확한 열쇠를 입력하십시오.");
        
        const tunnelId = parts[1];
        const btn = event.target;
        btn.innerHTML = "수신 중...";

        try {
            const res = await fetch(`${SERVER_URL}/summon/${tunnelId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accountId: MY_ACCOUNT_ID })
            });
            
            if (!res.ok) throw new Error();
            const slot = await res.json();
            const U = slot.scale;
            const restored = new Uint8Array(slot.matrix.map(m => (m.x * U) + m.d));
            
            const blob = new Blob([restored], { type: slot.metadata.t });
            const url = URL.createObjectURL(blob);
            document.getElementById('resultBox').innerHTML = `<a href="${url}" download="${slot.metadata.n}" style="color:var(--success); font-weight:800; font-size:16px; text-decoration:none;">📥 [${slot.metadata.n}] 자산 다운로드 완료</a>`;
            
            syncAccount();
        } catch(e) {
            alert("열쇠가 만료되었거나 올바르지 않습니다.");
        } finally {
            btn.innerHTML = "열쇠로 자산 실체화";
        }
    }

    window.onload = initCredential;
    setInterval(syncAccount, 30000);
</script>
</body>
</html>
