<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAY Algebraic Bank Terminal</title>
    <style>
        :root { --primary: #38bdf8; --bg: #020617; --card: #0f172a; --success: #10b981; --danger: #ef4444; --text: #f1f5f9; }
        body { font-family: 'Consolas', monospace; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; margin: 0; }
        .terminal { width: 100%; max-width: 1100px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 계좌 정보 헤더 */
        .header-box { background: #000; border: 1px solid #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-left: 5px solid var(--primary); }
        .account-details h1 { margin: 0; font-size: 22px; color: var(--primary); letter-spacing: 1px; }
        .credential-tag { font-size: 11px; background: #1e293b; padding: 4px 8px; border-radius: 4px; color: #94a3b8; margin-top: 8px; display: inline-block; cursor: pointer; transition: 0.2s; }
        .credential-tag:hover { background: var(--primary); color: #000; }
        
        .balance-grid { display: flex; gap: 40px; }
        .stat-item { text-align: right; }
        .stat-val { font-size: 24px; font-weight: bold; color: var(--text); }
        .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; margin-top: 4px; }

        /* 메인 작업 영역 */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #1e293b; position: relative; overflow: hidden; }
        .panel::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--primary), transparent); opacity: 0.3; }
        h2 { font-size: 14px; color: var(--primary); margin: 0 0 20px 0; display: flex; align-items: center; gap: 8px; }
        
        label { font-size: 11px; color: #64748b; margin-bottom: 8px; display: block; }
        input, button { width: 100%; background: #000; border: 1px solid #334155; color: var(--text); padding: 14px; margin-bottom: 15px; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .btn-action { background: var(--primary); color: #000; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .btn-action:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-action:active { transform: translateY(0); }
        
        /* 장부 테이블 */
        .ledger-panel { background: #000; border: 1px solid #1e293b; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: #64748b; padding: 12px; border-bottom: 1px solid #1e293b; font-weight: normal; }
        td { padding: 14px 12px; border-bottom: 1px solid #0f172a; }
        .type-emit { color: #facc15; }
        .type-rcv { color: var(--success); }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header-box">
        <div class="account-details">
            <h1>🏦 ALGEBRAIC BANK</h1>
            <div class="credential-tag" id="accIdDisplay" onclick="copyCredential()" title="클릭하여 개인 열쇠 복사">인증 확인 중...</div>
        </div>
        <div class="balance-grid">
            <div class="stat-item">
                <div class="stat-val" id="statEmitted">0.00 MB</div>
                <div class="stat-label">총 송금 자산</div>
            </div>
            <div class="stat-item">
                <div class="stat-val" id="statReceived" style="color:var(--success);">0.00 MB</div>
                <div class="stat-label">총 수신 자산</div>
            </div>
            <div class="stat-item">
                <div class="stat-val" id="statActive" style="color:#facc15;">0</div>
                <div class="stat-label">활성 터널</div>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="panel">
            <h2>📤 EMISSION (데이터 송금)</h2>
            <label>대상 파일 선택 (3D 모델, 이미지, 영상)</label>
            <input type="file" id="fileInput">
            <div style="display: flex; gap: 10px;">
                <div style="flex:1;"><label>정밀도 R</label><input type="number" id="sr" value="19"></div>
                <div style="flex:1;"><label>분해능 S</label><input type="number" id="ss" value="11"></div>
            </div>
            <button class="btn-action" onclick="emitAsset()">차원 투영 및 송금 실행</button>
            <div id="finalKey" style="text-align: center; color: #facc15; font-size: 18px; font-weight: bold; margin-top:10px; min-height: 24px;"></div>
        </div>

        <div class="panel">
            <h2>📥 MATERIALIZATION (데이터 수신)</h2>
            <label>소환 열쇠 입력 (RAY-XXXXX-XXXX)</label>
            <input type="text" id="keyInput" placeholder="전달받은 열쇠를 입력하세요">
            <button class="btn-action" style="background: var(--success);" onclick="materializeAsset()">열쇠로 데이터 실체화</button>
            <div id="resultBox" style="margin-top: 15px; text-align: center;"></div>
        </div>
    </div>

    <div class="ledger-panel">
        <h2>📑 TRANSACTION LEDGER (이체 내역)</h2>
        <table>
            <thead>
                <tr><th>시간</th><th>구분</th><th>터널 ID</th><th>파일명</th><th>크기</th></tr>
            </thead>
            <tbody id="ledgerBody">
                <tr><td colspan="5" style="text-align:center; color:#64748b; padding: 40px;">데이터 뱅크 접속 중...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SERVER_URL = window.location.origin;
    let MY_ACCOUNT_ID = null;

    /**
     * [Credential] 초기 자격 증명 로드 및 발급
     */
    async function initCredential() {
        let privateKey = localStorage.getItem('RAY_BANK_PRIVATE_KEY');
        
        if (!privateKey) {
            // 최초 접속자에게 고유 대수학적 열쇠 발급
            const array = new Uint32Array(4);
            window.crypto.getRandomValues(array);
            privateKey = 'RAY-' + Array.from(array).map(n => n.toString(36)).join('-').toUpperCase();
            localStorage.setItem('RAY_BANK_PRIVATE_KEY', privateKey);
        }
        
        MY_ACCOUNT_ID = privateKey;
        document.getElementById('accIdDisplay').innerText = `KEY: ${MY_ACCOUNT_ID}`;
        syncAccount();
    }

    function copyCredential() {
        navigator.clipboard.writeText(MY_ACCOUNT_ID);
        alert("개인 자격 증명(열쇠)이 복사되었습니다.\n다른 기기에서 접속 시 이 키를 사용하세요.");
    }

    /**
     * [Sync] 서버와 장부 동기화
     */
    async function syncAccount() {
        try {
            const res = await fetch(`${SERVER_URL}/account/${MY_ACCOUNT_ID}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            
            document.getElementById('statEmitted').innerText = `${data.totalEmitted.toFixed(2)} MB`;
            document.getElementById('statReceived').innerText = `${data.totalReceived.toFixed(2)} MB`;
            document.getElementById('statActive').innerText = data.activeTunnels;

            const tbody = document.getElementById('ledgerBody');
            if (data.history.length > 0) {
                tbody.innerHTML = data.history.map(h => `
                    <tr>
                        <td>${h.time}</td>
                        <td class="${h.type.includes('EMIT') ? 'type-emit' : 'type-rcv'}"><b>${h.type}</b></td>
                        <td>${h.tunnel}</td>
                        <td>${h.file}</td>
                        <td>${h.size}</td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b; padding: 40px;">거래 내역이 없습니다.</td></tr>`;
            }
        } catch(e) {
            console.error("서버 연결 실패");
        }
    }

    /**
     * [Emit] 파일 송금 로직
     */
    async function emitAsset() {
        const fileIn = document.getElementById('fileInput');
        if (fileIn.files.length === 0) return alert("파일을 선택하십시오.");
        
        const btn = event.target;
        btn.innerText = "차원 투영 중...";
        btn.disabled = true;

        const f = fileIn.files[0];
        const r = parseInt(document.getElementById('sr').value);
        const s = parseInt(document.getElementById('ss').value);
        const U = Math.floor(Math.pow((r*r + s*s)/2, 2));
        
        const bytes = new Uint8Array(await f.arrayBuffer());
        const matrix = Array.from(bytes).map(b => ({ x: Math.floor(b / U), d: b % U }));
        const meta = { n: f.name, t: f.type, s: f.size };

        try {
            const res = await fetch(`${SERVER_URL}/emit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accountId: MY_ACCOUNT_ID, matrix, scale: U, metadata: meta })
            });
            const { tunnelId } = await res.json();
            document.getElementById('finalKey').innerText = `RAY-${tunnelId}-${r}${s}`;
            syncAccount();
        } catch(e) {
            alert("서버 전송 실패. 파일 크기가 너무 크거나 서버 메모리가 부족합니다.");
        } finally {
            btn.innerText = "차원 투영 및 송금 실행";
            btn.disabled = false;
        }
    }

    /**
     * [Materialize] 데이터 수신 및 실체화
     */
    async function materializeAsset() {
        const fullKey = document.getElementById('keyInput').value;
        const parts = fullKey.split('-');
        if (parts.length < 3) return alert("유효하지 않은 열쇠 형식입니다.");
        
        const tunnelId = parts[1];
        const btn = event.target;
        btn.innerText = "실체화 중...";

        try {
            const res = await fetch(`${SERVER_URL}/summon/${tunnelId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accountId: MY_ACCOUNT_ID })
            });
            
            if (!res.ok) throw new Error();
            const slot = await res.json();
            const U = slot.scale;
            const restored = new Uint8Array(slot.matrix.map(m => (m.x * U) + m.d));
            
            const blob = new Blob([restored], { type: slot.metadata.t });
            const url = URL.createObjectURL(blob);
            document.getElementById('resultBox').innerHTML = `<a href="${url}" download="${slot.metadata.n}" style="color:var(--success); font-weight:bold; font-size:16px;">📥 ${slot.metadata.n} 다운로드</a>`;
            
            syncAccount();
        } catch(e) {
            alert("만료되었거나 잘못된 열쇠입니다.");
        } finally {
            btn.innerText = "열쇠로 데이터 실체화";
        }
    }

    // 페이지 로드 시 자격 증명 초기화
    window.onload = initCredential;
    // 30초마다 장부 자동 동기화
    setInterval(syncAccount, 30000);
</script>

</body>
</html>
